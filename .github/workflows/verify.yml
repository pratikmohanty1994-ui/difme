# Fast gates on every push and PR: formal verification, API governance, GitOps manifests.
name: verify
on:
  push: { branches: [main, "wip-*"] }
  pull_request:
permissions: { contents: read }
concurrency: { group: "verify-${{ github.ref }}", cancel-in-progress: true }

jobs:
  tla:
    name: TLA+ model checking (hard gate)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "25" }
      - run: curl -fsSL -o /tmp/tla2tools.jar https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar
      - run: TLA_JAR=/tmp/tla2tools.jar bash specs/tla/check.sh

  api-governance:
    name: API contracts (OpenAPI · AsyncAPI · proto · GraphQL · CloudEvents)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: OpenAPI lint
        run: npx -y @stoplight/spectral-cli@6.14.2 lint --ruleset api/openapi/.spectral.yaml --fail-severity error api/openapi/difme.openapi.yaml
      - name: AsyncAPI validate
        run: docker run --rm -v "$PWD/api:/api" -w /api/asyncapi asyncapi/cli:2.16.0 validate difme.asyncapi.yaml
      - name: Avro schemas parse
        run: for f in api/avro/*.avsc; do python3 -c "import json,sys; json.load(open('$f'))" || exit 1; done
      - name: CloudEvents envelope schema
        run: npx -y -p ajv-cli@5.0.0 -p ajv-formats@3.0.1 ajv compile --spec=draft2020 -c ajv-formats -s api/cloudevents/envelope.schema.json
      - name: GraphQL SDL validate
        run: |
          npm i --no-save --prefix /tmp/gql graphql@16.10.0
          NODE_PATH=/tmp/gql/node_modules node -e "const g=require('graphql');const s=g.buildSchema(require('fs').readFileSync('api/graphql/backoffice.graphql','utf8'));console.log('schema ok:',Object.keys(s.getQueryType().getFields()).length,'queries')"
      - uses: bufbuild/buf-action@v1
        with: { input: api/proto, lint: true, format: false, breaking: "${{ github.event_name == 'pull_request' }}", breaking_against: "${{ github.event.repository.clone_url }}#branch=main,subdir=api/proto", push: false }
      - name: OpenAPI breaking-change gate
        if: github.event_name == 'pull_request'
        run: |
          git show origin/main:api/openapi/difme.openapi.yaml > /tmp/base.yaml
          docker run --rm -v "$PWD:/w" -v /tmp:/t tufin/oasdiff:v1.11.1 breaking /t/base.yaml /w/api/openapi/difme.openapi.yaml --fail-on ERR

  gitops:
    name: GitOps catalog + manifests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyyaml==6.0.2
      - name: Generated Argo CD apps are current
        run: python deploy/argocd/render.py --check
      - name: Vertical packs are valid (ADR-020)
        run: python verticals/check.py
      - name: Generated Tazama manifests are current
        run: python deploy/platform/fraud/tazama/render.py --check
      - name: OpenBao configuration requests are current (F2)
        run: python deploy/platform/security/openbao-config/render.py --check
      - name: No key material in the deployment tree (ADR-026, keys only through attested key release)
        run: bash ci/no-key-material.sh
      - name: Generated core-service manifests are current
        run: python deploy/components/quarkus-service/render.py && git diff --exit-code deploy/platform/core-platform/core-services/generated.yaml deploy/platform/core-platform/stream-services/generated.yaml
      - name: Every catalog entry has its config directory
        run: |
          python - <<'PY'
          import yaml, pathlib, sys
          bad = []
          for c in yaml.safe_load(open("deploy/argocd/catalog.yaml"))["components"]:
              d = pathlib.Path(f"deploy/platform/{c['ns']}/{c['name']}")
              need = d / ("values.yaml" if c["kind"] == "helm" else "kustomization.yaml")
              if not need.exists(): bad.append(str(need))
          print("\n".join(bad)); sys.exit(1 if bad else 0)
          PY
      # Helm values are not built by kustomize; a broken flow mapping in risingwave/values.yaml reached a cluster run and
      # left the app "Unknown" (2026-11-20). Parse every YAML file under deploy/.
      - name: Every manifest and values file parses
        run: |
          python - <<'PY'
          import yaml, pathlib, sys
          bad = []
          for f in pathlib.Path("deploy").rglob("*.yaml"):
              try: list(yaml.safe_load_all(f.read_text()))
              except yaml.YAMLError as e: bad.append(f"{f}: {str(e).splitlines()[0]}")
          print("\n".join(bad)); sys.exit(1 if bad else 0)
          PY
      - name: Kustomize build every path component
        run: |
          curl -fsSL https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.6.0/kustomize_v5.6.0_linux_amd64.tar.gz | tar xz -C /usr/local/bin
          fail=0
          for k in $(find deploy/platform -name kustomization.yaml); do
            d=$(dirname "$k"); kustomize build --load-restrictor LoadRestrictionsNone "$d" > /dev/null || { echo "✗ $d"; fail=1; }
          done
          exit $fail
      - name: Helm charts resolve at pinned versions
        run: |
          python - <<'PY' > /tmp/charts.txt
          import yaml
          for c in yaml.safe_load(open("deploy/argocd/catalog.yaml"))["components"]:
              if c["kind"] == "helm": print(c["name"], c["repo"], c["chart"], c["version"], c["ns"])
          PY
          set +e
          fail=0
          while read name repo chart version ns; do
            if [[ "$repo" == *docker.io* ]]; then ref="oci://$repo/$chart"; else ref="$chart --repo $repo"; fi
            helm template "$name" $ref --version "$version" -n "$ns" --api-versions cert-manager.io/v1 --api-versions monitoring.coreos.com/v1 -f "deploy/platform/$ns/$name/values.yaml" > /tmp/out.yaml 2>/tmp/err \
              && echo "✓ $name $version" || { echo "✗ $name $version: $(head -c 300 /tmp/err)"; fail=1; }
            # Withdrawn image catalogs must never be referenced (found live: bitnami/kubectl is no longer pullable).
            if grep -qE 'image: .*bitnami/' /tmp/out.yaml; then
              echo "✗ $name renders a withdrawn bitnami image: $(grep -oE 'bitnami/[^" ]+' /tmp/out.yaml | sort -u | tr '\n' ' ')"; fail=1
            fi
          done < /tmp/charts.txt
          exit $fail
