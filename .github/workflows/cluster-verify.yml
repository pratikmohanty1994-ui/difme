# Ephemeral full-cluster verification on a free GitHub-hosted runner (public repo: 4 vCPU / 16 GB, x64 or arm64).
# Same steps as the dev runtime: make cluster → base → each profile in order via ci/verify-profile.sh, with the
# memory footprint after each. Argo CD syncs from the branch this runs on, so a wip-* branch is verified before main.
# The runner is discarded afterwards; reports land in the job summary and the "cluster-report" artifact.
# Independent runs share nothing, so several profile sets can be verified in parallel.
name: cluster-verify
on:
  workflow_dispatch:
    inputs:
      profiles: { description: "Profiles after base, in order (comma-separated)", default: "core", type: string }
      runner:   { description: "Runner", default: "ubuntu-24.04", type: choice, options: ["ubuntu-24.04", "ubuntu-24.04-arm"] }
      deadline: { description: "Per-profile convergence deadline (s)", default: "1800", type: string }
      measure:  { description: "Payment baseline after the profiles: ci/measure.sh args, e.g. '200 60s' (empty = skip)", default: "", type: string }
      settle:   { description: "Seconds to wait after convergence before the process report (idle I/O measurements; 0 = none)", default: "0", type: string }
permissions: { contents: read }
# One cluster at a time, repo-wide: each run holds a 16 GB runner for up to ~3 h, and five in parallel on 2026-11-20
# preceded GitHub disabling Actions for the account. A newer dispatch waits; GitHub keeps only the latest one pending.
concurrency: { group: cluster-verify, cancel-in-progress: false }

jobs:
  verify:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 345
    env:
      DIFME_IMAGE_DIR: /mnt/difme/containerd
      DIFME_SWAP_FILE: /mnt/difme/swap
      DIFME_SWAP_SIZE: 12G
      # Halve memory requests too (ci/dev-sizing-memory.py): hosted runners don't run earlyoom; limits unchanged.
      DIFME_DEV_MEMORY_SCALING: "1"
    steps:
      - uses: actions/checkout@v4
      # The hosted runner was lost twice on the streaming+lakehouse chain (2026-11-20, log gone with it): under memory
      # pressure the agent is starved or OOM-killed and misses its heartbeat. Exempt it from the OOM killer and give it
      # CPU and I/O priority over the cluster, so pods are what get squeezed.
      - name: Guard the runner agent
        run: |
          for p in $(pgrep -f 'Runner\.(Listener|Worker)|provjobd|hosted-compute-agent'); do
            echo -1000 | sudo tee /proc/$p/oom_score_adj >/dev/null
            sudo renice -n -10 -p "$p" >/dev/null; sudo ionice -c2 -n0 -p "$p"
          done
          pgrep -af 'Runner\.(Listener|Worker)' | cut -c1-120
      - name: Free disk (preinstalled SDKs the cluster never uses)
        run: |
          df -h / /mnt | sed 1d
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift || true
          docker system prune -af >/dev/null 2>&1 || true
          sudo mkdir -p /mnt/difme && sudo chown "$USER" /mnt/difme
          df -h / /mnt | sed 1d
      - name: Tools (pinned, per arch)
        run: |
          set -eux
          A=$(dpkg --print-architecture); B=/usr/local/bin
          curl -fsSL https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh | TAG=v5.8.3 bash
          curl -fsSL -o /tmp/kubectl "https://dl.k8s.io/release/v1.32.3/bin/linux/$A/kubectl" && sudo install /tmp/kubectl $B/kubectl
          curl -fsSL "https://get.helm.sh/helm-v3.17.3-linux-$A.tar.gz" | sudo tar xz -C $B --strip-components=1 "linux-$A/helm"
          curl -fsSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.6.0/kustomize_v5.6.0_linux_$A.tar.gz" | sudo tar xz -C $B
          sudo apt-get install -y -qq acl xxd >/dev/null
          python3 -c "import yaml" 2>/dev/null || pip install -q --break-system-packages pyyaml
      - name: Point Argo CD at this branch
        run: |
          sed -i "s#targetRevision: main\$#targetRevision: ${GITHUB_REF_NAME}#" deploy/argocd/apps/*.yaml
          grep -c "targetRevision: ${GITHUB_REF_NAME}" deploy/argocd/apps/*.yaml | awk -F: '{s+=$2} END {print s " app sources now track '"${GITHUB_REF_NAME}"'"}'
      - name: Cluster (k3d + Cilium + Argo CD + base profile + dev secrets)
        run: make cluster
      - name: Base profile healthy
        run: bash ci/verify-profile.sh base "${{ inputs.deadline }}" 2>&1 | tee -a /tmp/report.txt
      - name: Profiles
        run: |
          rc=0
          for p in $(echo "${{ inputs.profiles }}" | tr ',' ' '); do
            echo "::group::$p"
            PROC_SETTLE="${{ inputs.settle }}" bash ci/verify-profile.sh "$p" "${{ inputs.deadline }}" 2>&1 | tee -a /tmp/report.txt
            r=${PIPESTATUS[0]}; echo "::endgroup::"
            echo "$p: $([ $r -eq 0 ] && echo converged || echo FAILED)" >> /tmp/verdicts.txt
            [ $r -ne 0 ] && { rc=$r; break; }    # later profiles would run on a broken base
          done
          exit $rc
      - name: Payment baseline (ci/measure.sh)
        if: success() && inputs.measure != ''
        run: |
          # k6 runs as an in-cluster Job in "k6"; that namespace otherwise comes only with platform-ops (k6-operator).
          kubectl create namespace k6 --dry-run=client -o yaml | kubectl apply -f -
          set -o pipefail   # a failed baseline must fail the step, not hide behind tee (2026-11-20)
          bash ci/measure.sh ${{ inputs.measure }} 2>&1 | tee /tmp/measure.txt
      - name: Summary
        if: always()
        run: |
          {
            echo "## cluster-verify: ${{ inputs.profiles }} on ${{ inputs.runner }} (${GITHUB_REF_NAME})"
            echo '```'; cat /tmp/verdicts.txt 2>/dev/null; echo '```'
            echo '```'; bash ci/mem-report.sh 15 2>/dev/null; echo '```'
            echo '```'; kubectl -n argocd get applications --no-headers 2>/dev/null; echo '```'
            # if/fi, not `[ ] && {}`: under bash -e a false test as the group's last command failed the step (2026-11-20).
            if [ -s /tmp/measure.txt ]; then echo '### payment baseline'; echo '```'; cat /tmp/measure.txt; echo '```'; fi
          } >> "$GITHUB_STEP_SUMMARY"
          mkdir -p /tmp/out && cp /tmp/report.txt /tmp/verdicts.txt /tmp/measure.txt /tmp/up-*.log /tmp/out/ 2>/dev/null || true
          kubectl get pods -A -o wide > /tmp/out/pods.txt 2>&1 || true
          # logs and events of every pod that is not Running/Completed, so a failed run explains itself
          kubectl get pods -A --no-headers 2>/dev/null | awk '$4!="Running" && $4!="Completed" {print $1, $2}' | while read -r ns pod; do
            { echo "== $ns/$pod"; kubectl -n "$ns" describe pod "$pod" | sed -n '/^Events:/,$p'; kubectl -n "$ns" logs "$pod" --all-containers --tail=60 2>&1; kubectl -n "$ns" logs "$pod" --all-containers --previous --tail=60 2>&1; } >> /tmp/out/failing-pods.txt
          done || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: "cluster-report-${{ inputs.runner }}", path: /tmp/out, retention-days: 14 }
