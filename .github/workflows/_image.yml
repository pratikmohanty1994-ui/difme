# Reusable image pipeline (PDF §4.5, §11.2). Running every build inside one reusable workflow isolates the
# build from the caller, which gives SLSA Build Level 3 provenance via GitHub artifact attestations.
# Steps: prebuild → buildx push → Trivy (CRITICAL blocks) → Syft SBOM attestation → cosign keyless sign → SLSA provenance.
name: _image
on:
  workflow_call:
    inputs:
      name:        { type: string, required: true }    # image name without registry, e.g. difme-cmd-svc
      context:     { type: string, default: "." }
      dockerfile:  { type: string, required: true }
      build-args:  { type: string, default: "" }
      java:        { type: boolean, default: false }
      node:        { type: boolean, default: false }
      prebuild:    { type: string, default: "true" }
      version:     { type: string, default: "0.1.0" }
      # Multi-arch (2026-11-20: the runtime moves to an arm64 cloud VM). Arch-independent builds (jars, JS
      # bundles) publish both platforms from one job; native binaries build per arch on a matching runner with a
      # tag suffix, and _manifest.yml joins them under the plain tag.
      platforms:   { type: string, default: "linux/amd64,linux/arm64" }
      runner:      { type: string, default: "ubuntu-24.04" }
      tag-suffix:  { type: string, default: "" }
      sign:        { type: boolean, default: true }      # per-arch native images are signed on the joined manifest
      smoke:       { type: string, default: "" }         # optional shell check against "$IMAGE:scan" before push
      # Swapfile size (e.g. "24G") for builds that outgrow the runner's 16 GB RAM (Hyperswitch router, 2026-11-21).
      # Frees the preinstalled SDKs first so the swapfile and the build tree both fit on disk.
      swap:        { type: string, default: "" }
    outputs:
      digest: { value: "${{ jobs.image.outputs.digest }}" }

jobs:
  image:
    runs-on: ${{ inputs.runner }}
    permissions: { contents: read, packages: write, id-token: write, attestations: write }
    outputs: { digest: "${{ steps.push.outputs.digest }}" }
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ inputs.name }}
    steps:
      - uses: actions/checkout@v4
      - name: Free disk and add swap
        if: inputs.swap != ''
        env: { DIFME_SWAP_SIZE: "${{ inputs.swap }}" }
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache /usr/share/swift || true
          docker system prune -af >/dev/null 2>&1 || true
          # /mnt is the runner's scratch disk where it exists (amd64); otherwise the root disk.
          D=/mnt; avail() { df --output=avail -BG "$1" 2>/dev/null | tail -1 | tr -dc 0-9; }
          [ "$(avail /mnt || echo 0)" -ge 40 ] 2>/dev/null || D=/var/tmp
          sudo mkdir -p "$D/difme"
          DIFME_SWAP_FILE="$D/difme/swap" bash ci/image-disk.sh swap
          free -g; df -h / /mnt 2>/dev/null | sed 1d
      - if: inputs.java
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "25", cache: maven }
      # Maven Central rate-limits shared CI IPs (HTTP 429 seen 2026-11-20 with ~30 parallel jobs); resolve through
      # a public Maven Central mirror instead.
      - if: inputs.java
        name: Maven mirror
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'XML'
          <settings><mirrors><mirror><id>central-gcs</id><mirrorOf>central</mirrorOf>
          <url>https://maven-central.storage-download.googleapis.com/maven2/</url></mirror></mirrors></settings>
          XML
      - if: inputs.node
        uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Prebuild
        run: ${{ inputs.prebuild }}
      - if: contains(inputs.platforms, ',')
        uses: docker/setup-qemu-action@v3
      # docker.io base images (rust, node, golang, debian, eclipse-temurin) come through a public pull-through cache
      # first: anonymous docker.io pulls hit HTTP 429 when ~25 image jobs start together (2026-11-20, flink-jobs).
      # BuildKit falls back to docker.io itself when the mirror lacks an image.
      - uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Build (local) for scanning
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          build-args: ${{ inputs.build-args }}
          load: true
          tags: ${{ env.IMAGE }}:scan
      - name: Smoke test
        if: inputs.smoke != ''
        run: ${{ inputs.smoke }}
      - name: Trivy — CRITICAL vulnerabilities block promotion
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.59.1             image --severity CRITICAL --ignore-unfixed --exit-code 1 --no-progress "${IMAGE}:scan"
      - name: Push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          build-args: ${{ inputs.build-args }}
          push: true
          provenance: false
          platforms: ${{ inputs.platforms }}
          # The release tag moves only on main; branch builds push sha tags only (a branch build once overwrote
          # :0.1.0 with a branch-signed image that admission then rejected, 2026-11-20).
          tags: |
            ${{ github.ref == 'refs/heads/main' && format('{0}:{1}{2}', env.IMAGE, inputs.version, inputs.tag-suffix) || '' }}
            ${{ env.IMAGE }}:sha-${{ github.sha }}${{ inputs.tag-suffix }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.version }}
      - name: Syft SBOM
        if: inputs.sign
        uses: anchore/sbom-action@v0
        with: { image: "${{ env.IMAGE }}@${{ steps.push.outputs.digest }}", format: spdx-json, output-file: sbom.spdx.json, upload-artifact: true }
      - name: Attest SBOM (stored next to the image)
        if: inputs.sign
        uses: actions/attest-sbom@v2
        with: { subject-name: "${{ env.IMAGE }}", subject-digest: "${{ steps.push.outputs.digest }}", sbom-path: sbom.spdx.json, push-to-registry: true }
      - if: inputs.sign
        uses: sigstore/cosign-installer@v3
      - name: Cosign keyless signature
        if: inputs.sign
        run: cosign sign --yes "${IMAGE}@${{ steps.push.outputs.digest }}"
      - name: SLSA provenance (Build L3 via reusable workflow)
        if: inputs.sign
        id: provenance
        uses: actions/attest-build-provenance@v2
        with: { subject-name: "${{ env.IMAGE }}", subject-digest: "${{ steps.push.outputs.digest }}", push-to-registry: true }
      # Kyverno verifyImages reads cosign-format attestations, not the Sigstore-bundle referrers written above
      # (found by a server dry run on the live cluster). Publish both, signed by this same workflow identity.
      - name: Cosign attestations for admission control (SLSA provenance + SPDX SBOM)
        if: inputs.sign
        run: |
          REF="${IMAGE}@${{ steps.push.outputs.digest }}"
          jq -r '.dsseEnvelope.payload' "${{ steps.provenance.outputs.bundle-path }}" | base64 -d | jq '.predicate' > provenance.json
          cosign attest --yes --type slsaprovenance1 --predicate provenance.json "$REF"
          cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$REF"
