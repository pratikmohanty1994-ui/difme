# Builds every DIFME image on change. Each leg calls the reusable _image pipeline.
name: images
on:
  push:
    branches: [main]
    paths: ["services/**", "ml/fraud/**", "ml/feast/**", "verticals/**", "vendor/**", "backoffice/**", "pwa/**", "analytics/**", "processes/dmn/**", "deploy/images/**", "api/proto/**", ".github/workflows/images.yml", ".github/workflows/_image.yml", ".github/workflows/_manifest.yml"]
  workflow_dispatch:
permissions: { contents: read, packages: write, id-token: write, attestations: write }
# A newer push supersedes an older image build of the same ref: every run rebuilds every image, so three merges in a
# row queued three full builds (~25 jobs each) and starved the 20-job runner limit (2026-11-20).
concurrency: { group: "images-${{ github.ref }}", cancel-in-progress: true }

jobs:
  # Builds only the images whose sources changed since the last successful images run on this branch (not just since
  # the previous push: a cancelled run must not drop an image). Manual dispatch, a first run, or a change to the image
  # pipeline itself rebuilds everything. Every-image rebuilds on each merge (~30 jobs) were the bulk of the Actions
  # usage that got the account's Actions disabled (2026-11-20).
  changes:
    runs-on: ubuntu-24.04
    permissions: { contents: read, actions: read }
    outputs:
      core: ${{ steps.d.outputs.core }}
      backoffice: ${{ steps.d.outputs.backoffice }}
      pwa: ${{ steps.d.outputs.pwa }}
      flink: ${{ steps.d.outputs.flink }}
      dbt: ${{ steps.d.outputs.dbt }}
      formio: ${{ steps.d.outputs.formio }}
      hub: ${{ steps.d.outputs.hub }}
      attestation: ${{ steps.d.outputs.attestation }}
      feast: ${{ steps.d.outputs.feast }}
      notary: ${{ steps.d.outputs.notary }}
      fraud: ${{ steps.d.outputs.fraud }}
      scheme: ${{ steps.d.outputs.scheme }}
      fineract: ${{ steps.d.outputs.fineract }}
      hyperswitch: ${{ steps.d.outputs.hyperswitch }}
      debezium: ${{ steps.d.outputs.debezium }}
      veraison: ${{ steps.d.outputs.veraison }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: d
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          base=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow images.yml --branch "$GITHUB_REF_NAME" --status success \
                 --limit 1 --json headSha -q '.[0].headSha' 2>/dev/null || true)
          all=false
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] || [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then all=true; fi
          files=$([ "$all" = true ] || git diff --name-only "$base" HEAD)
          echo "$files" | grep -qE '^\.github/workflows/(images|_image|_manifest)\.yml$' && all=true
          echo "base ${base:-none} all=$all"; echo "$files" | head -50
          check() { if [ "$all" = true ] || echo "$files" | grep -qE "$2"; then echo "$1=true" >> "$GITHUB_OUTPUT"; echo "build: $1"; else echo "$1=false" >> "$GITHUB_OUTPUT"; fi; }
          check core '^(services/core/|api/proto/|api/openapi/|verticals/)'
          check backoffice '^(backoffice/|vendor/formio/js/)'
          check pwa '^pwa/'
          check flink '^(analytics/flink-jobs/|processes/dmn/)'
          check dbt '^analytics/dbt/'
          check formio '^(vendor/formio/server/|deploy/images/formio/)'
          check hub '^(services/hub/|api/proto/|deploy/images/quinn-hub/)'
          check attestation '^(services/attestation/|api/proto/|deploy/images/attestation-verifier/)'
          check feast '^(ml/feast/|deploy/images/feast/)'
          check notary '^(services/notary/|deploy/images/notary/)'
          check fraud '^(services/fraud-scorer/|ml/fraud/|deploy/images/fraud-scorer/)'
          check scheme '^(services/scheme-sim/|vendor/moov-iso8583/|deploy/images/scheme-sim/)'
          check fineract '^(vendor/fineract/|deploy/images/fineract/)'
          check hyperswitch '^(vendor/hyperswitch/|deploy/images/hyperswitch/)'
          check debezium '^deploy/images/debezium-connect/'
          check veraison '^deploy/images/veraison/'
  core:
    needs: changes
    if: needs.changes.outputs.core == 'true'
    # ADR-012 hybrid runtimes: native images for light I/O-bound services, JVM + AOT cache for hot paths.
    # Built per arch on matching runners (2026-11-20, arm64 runtime): native binaries and the Java AOT cache are both
    # CPU-specific, so emulation is not an option. core-manifest joins -amd64/-arm64 under the plain tag and signs it.
    strategy:
      fail-fast: false
      max-parallel: 8          # keeps the dependency download burst moderate
      matrix:
        module: [cmd-svc, qry-svc, saga-orchestrator, rehydration-svc, consistency-router, rate-limiter, projection-svc,
                 replay-engine, process-gateway, exchange-svc, payment-hub]
        arch: [amd64, arm64]
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
          # Native: light I/O-bound services (rehydration-svc: KEDA keeps 2 replicas; gRPC + Kafka + Redis are native-clean).
          # JVM: process-gateway (Temporal SDK shaded Netty is not native-image clean), exchange-svc (Agrona off-heap rings).
          - { module: rehydration-svc,    native: true }
          - { module: consistency-router, native: true }
          - { module: rate-limiter,       native: true }
          - { module: projection-svc,     native: true }
          - { module: replay-engine,      native: true }
    uses: ./.github/workflows/_image.yml
    with:
      name: difme-${{ matrix.module }}
      dockerfile: ${{ matrix.native && 'services/core/Dockerfile.native' || 'services/core/Dockerfile.jvm' }}
      build-args: |
        MODULE=${{ matrix.module }}
      java: true
      platforms: linux/${{ matrix.arch }}
      runner: ${{ matrix.runner }}
      tag-suffix: -${{ matrix.arch }}
      sign: false
      # Retried: x64 runners intermittently get "Could not find artifact" for artifacts Central does serve (shared-IP
      # throttling, seen 2026-11-20 on a different artifact each run); the not-found markers are cleared between tries.
      prebuild: >-
        for try in 1 2 3; do
        mvn -B -ntp -q -U -Daether.connector.http.retryHandler.count=5 -f services/core/pom.xml -pl ${{ matrix.module }} -am package -DskipTests
        ${{ matrix.native && '-Dquarkus.native.enabled=true -Dquarkus.package.jar.enabled=false -Dquarkus.native.container-build=true -Dquarkus.native.builder-image=quay.io/quarkus/ubi9-quarkus-mandrel-builder-image:jdk-25' || '-Dquarkus.package.jar.aot.enabled=true' }}
        && break; [ $try = 3 ] && exit 1; find ~/.m2/repository -name '*.lastUpdated' -delete; sleep $((try * 45)); done

  core-manifest:
    # -U above: the restored x64 Maven cache held "not found" markers for artifacts that exist in Central (qry-svc
    # failed twice on amd64 only, 2026-11-20). !cancelled(): one failed leg must not skip every other manifest;
    # a module whose arch images are missing fails its own join step.
    needs: [changes, core]
    if: ${{ !cancelled() && needs.changes.outputs.core == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        module: [cmd-svc, qry-svc, saga-orchestrator, rehydration-svc, consistency-router, rate-limiter, projection-svc,
                 replay-engine, process-gateway, exchange-svc, payment-hub]
    uses: ./.github/workflows/_manifest.yml
    with:
      name: difme-${{ matrix.module }}

  backoffice:
    needs: changes
    if: needs.changes.outputs.backoffice == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { app: shell,          image: difme-backoffice-shell,       out: dist }
          - { app: settlements,    image: difme-remote-settlements,     out: dist }
          - { app: compliance,     image: difme-remote-compliance,      out: dist }
          - { app: analytics,      image: difme-remote-analytics,       out: dist/browser }
          - { app: process-studio, image: difme-remote-process-studio,  out: dist }
          - { app: form-builder,   image: difme-remote-form-builder,    out: dist }
    uses: ./.github/workflows/_image.yml
    with:
      name: ${{ matrix.image }}
      dockerfile: backoffice/Dockerfile
      build-args: |
        APP=${{ matrix.app }}
        OUT=${{ matrix.out }}

  pwa:
    needs: changes
    if: needs.changes.outputs.pwa == 'true'
    # DiscountAI role apps (ADR-020): installable PWAs on the live exchange.
    strategy:
      fail-fast: false
      matrix:
        app: [shopbot, investor, exchange]
    uses: ./.github/workflows/_image.yml
    with:
      name: difme-pwa-${{ matrix.app }}
      context: pwa/discountai
      dockerfile: pwa/discountai/Dockerfile
      build-args: |
        APP=${{ matrix.app }}

  flink-jobs:
    needs: changes
    if: needs.changes.outputs.flink == 'true'
    uses: ./.github/workflows/_image.yml
    with:
      name: difme-flink-jobs
      dockerfile: analytics/flink-jobs/Dockerfile
      java: true
      prebuild: mvn -B -ntp -q -f analytics/flink-jobs/pom.xml package -DskipTests

  dbt:
    needs: changes
    if: needs.changes.outputs.dbt == 'true'
    uses: ./.github/workflows/_image.yml
    with:
      name: difme-dbt
      context: analytics/dbt
      dockerfile: analytics/dbt/Dockerfile

  formio:
    needs: changes
    if: needs.changes.outputs.formio == 'true'
    uses: ./.github/workflows/_image.yml
    with:
      name: difme-formio
      context: vendor/formio/server
      dockerfile: deploy/images/formio/Dockerfile

  quinn-hub:
    needs: changes
    if: needs.changes.outputs.hub == 'true'
    uses: ./.github/workflows/_image.yml
    with:
      name: difme-quinn-hub
      dockerfile: deploy/images/quinn-hub/Dockerfile
  attestation-verifier:
    needs: changes
    if: needs.changes.outputs.attestation == 'true'
    uses: ./.github/workflows/_image.yml
    with:
      name: difme-attestation-verifier
      dockerfile: deploy/images/attestation-verifier/Dockerfile
  feast:
    needs: changes
    if: needs.changes.outputs.feast == 'true'
    uses: ./.github/workflows/_image.yml
    with:
      name: difme-feast
      dockerfile: deploy/images/feast/Dockerfile
  notary:
    needs: changes
    if: needs.changes.outputs.notary == 'true'
    uses: ./.github/workflows/_image.yml
    with:
      name: difme-notary
      dockerfile: deploy/images/notary/Dockerfile
  fraud-scorer:
    needs: changes
    if: needs.changes.outputs.fraud == 'true'
    uses: ./.github/workflows/_image.yml
    with:
      name: difme-fraud-scorer
      dockerfile: deploy/images/fraud-scorer/Dockerfile
      # The model and ONNX Runtime must load: start the image and score one order.
      smoke: |
        docker run -d --name fs -p 18090:8090 "$IMAGE:scan" && sleep 3
        curl -fsS -X POST -H 'content-type: application/json' -d '{"amountZscore":0.2,"txnCount1h":1,"distinctCounterparties24h":2,"geoJumpKm1h":3,"newDeviceFlag":0,"edgeScoreMean24h":860}' localhost:18090/v1/score || { docker logs fs; exit 1; }

  scheme-sim:
    needs: changes
    if: needs.changes.outputs.scheme == 'true'
    uses: ./.github/workflows/_image.yml
    with:
      name: difme-scheme-sim
      dockerfile: deploy/images/scheme-sim/Dockerfile

  fineract:
    needs: changes
    if: needs.changes.outputs.fineract == 'true'
    uses: ./.github/workflows/_image.yml
    with:
      name: difme-fineract
      dockerfile: deploy/images/fineract/Dockerfile

  hyperswitch:
    # Native Rust binary: built per arch on a matching runner (emulated arm64 would take hours), joined below.
    needs: changes
    if: needs.changes.outputs.hyperswitch == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    uses: ./.github/workflows/_image.yml
    with:
      name: difme-hyperswitch
      dockerfile: deploy/images/hyperswitch/Dockerfile
      platforms: linux/${{ matrix.arch }}
      runner: ${{ matrix.runner }}
      tag-suffix: -${{ matrix.arch }}
      sign: false
      # rustc peaks above the runner's 16 GB on the router and hyperswitch_connectors crates (docs/knowledge-base/build.md).
      swap: 24G

  hyperswitch-manifest:
    needs: [changes, hyperswitch]
    if: ${{ !cancelled() && needs.changes.outputs.hyperswitch == 'true' }}
    uses: ./.github/workflows/_manifest.yml
    with:
      name: difme-hyperswitch

  debezium-connect:
    needs: changes
    if: needs.changes.outputs.debezium == 'true'
    uses: ./.github/workflows/_image.yml
    with:
      name: difme-debezium-connect
      context: deploy/images/debezium-connect
      dockerfile: deploy/images/debezium-connect/Dockerfile
      version: "3.7.1"

  veraison:
    needs: changes
    if: needs.changes.outputs.veraison == 'true'
    # Veraison publishes no images; built from a pinned commit (see the Dockerfile). The smoke test starts all three
    # services against the dev config and fails if any exits within 15 s.
    uses: ./.github/workflows/_image.yml
    with:
      name: difme-veraison
      context: deploy/images/veraison
      dockerfile: deploy/images/veraison/Dockerfile
      smoke: bash deploy/images/veraison/smoke.sh "$IMAGE:scan"
