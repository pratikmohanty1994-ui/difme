# Single source of truth for every platform component.
# `python deploy/argocd/render.py` turns this into deploy/argocd/apps/*.yaml and deploy/profiles/*.txt.
#
# kind: helm  -> upstream chart + values from deploy/platform/<namespace>/<name>/values.yaml
# kind: path  -> kustomize directory deploy/platform/<namespace>/<name>/
# wave: Argo CD sync wave (CRDs/operators first)
# pdf:  section of Financial Platform Architecture v1.2 this implements

components:
  # ── Layer 11 · Infrastructure (profile: base, always on) ─────────────────────
  - { name: namespaces,        ns: kube-system,     kind: path, profile: base, wave: -10, pdf: "4.2" }
  - { name: cilium,            ns: kube-system,     kind: helm, profile: base, wave: -9, pdf: "4.6", repo: https://helm.cilium.io, chart: cilium, version: 1.17.3 }
  - { name: metallb,           ns: ingress-system,  kind: helm, profile: base, wave: -8, pdf: "4.3", repo: https://metallb.github.io/metallb, chart: metallb, version: 0.14.9 }
  - { name: metallb-config,    ns: ingress-system,  kind: path, profile: base, wave: -7, pdf: "4.3" }
  - { name: cert-manager,      ns: ingress-system,  kind: helm, profile: base, wave: -8, pdf: "4.2", repo: https://charts.jetstack.io, chart: cert-manager, version: v1.17.1 }
  - { name: envoy-gateway,     ns: ingress-system,  kind: helm, profile: base, wave: -6, pdf: "4.3", repo: docker.io/envoyproxy, chart: gateway-helm, version: v1.4.0 }
  - { name: gateway-config,    ns: ingress-system,  kind: path, profile: base, wave: -4, pdf: "4.3" }
  - { name: external-dns,      ns: ingress-system,  kind: helm, profile: base, wave: -6, pdf: "4.2", repo: https://kubernetes-sigs.github.io/external-dns, chart: external-dns, version: 1.16.0 }
  - { name: kyverno,           ns: security,        kind: helm, profile: base, wave: -8, pdf: "5.8", repo: https://kyverno.github.io/kyverno, chart: kyverno, version: 3.3.7 }
  - { name: policies,          ns: security,        kind: path, profile: base, wave: -5, pdf: "11.3" }
  - { name: fleet-bundles,     ns: kube-system,     kind: path, profile: base, wave: -5, pdf: "4.1" }

  # ── Security / zero trust (profile: security) ──────────────────────────────
  - { name: openbao,           ns: security,        kind: helm, profile: security, wave: -4, pdf: "5.8", repo: https://openbao.github.io/openbao-helm, chart: openbao, version: 0.30.7 }   # OpenBao 2.7.2: static seal + self-init (2.4+)
  - { name: spire-crds,        ns: security,        kind: helm, profile: security, wave: -5, pdf: "5.8", repo: https://spiffe.github.io/helm-charts-hardened, chart: spire-crds, version: 0.5.0 }
  - { name: spire,             ns: security,        kind: helm, profile: security, wave: -4, pdf: "5.8", repo: https://spiffe.github.io/helm-charts-hardened, chart: spire, version: 0.24.1 }
  - { name: warpgate,          ns: security,        kind: path, profile: security, wave: -3, pdf: "5.8" }
  - { name: istio-base,        ns: istio-system,    kind: helm, profile: security, wave: -5, pdf: "4.4", repo: https://blob.istio.io/istio-release/charts, chart: base, version: 1.32.0 }
  - { name: istiod,            ns: istio-system,    kind: helm, profile: security, wave: -4, pdf: "4.4", repo: https://blob.istio.io/istio-release/charts, chart: istiod, version: 1.32.0 }
  - { name: istio-cni,         ns: istio-system,    kind: helm, profile: security, wave: -4, pdf: "4.4", repo: https://blob.istio.io/istio-release/charts, chart: cni, version: 1.32.0 }
  - { name: ztunnel,           ns: istio-system,    kind: helm, profile: security, wave: -3, pdf: "4.4", repo: https://blob.istio.io/istio-release/charts, chart: ztunnel, version: 1.32.0 }
  - { name: istio-config,      ns: istio-system,    kind: path, profile: security, wave: -2, pdf: "4.4" }
  - { name: attestation,       ns: security,        kind: path, profile: security, wave: 2,  pdf: "11.1" }
  - { name: notary,            ns: security,        kind: path, profile: security, wave: 1,  pdf: "ADR-020" }
  - { name: exchange-evidence, ns: core-platform,   kind: path, profile: security, wave: 3,  pdf: "ADR-020" }   # switches exchange-svc to OpenBao transit + notary
  - { name: keycloak,          ns: security,        kind: path, profile: security, wave: 0,  pdf: "4.1/ADR-010" }
  - { name: openbao-config,    ns: security,        kind: path, profile: security, wave: -3, pdf: "5.8" }   # F2: re-applies OpenBao's configuration on existing clusters
  - { name: tee-key-release,   ns: security,        kind: path, profile: security, wave: 0,  pdf: "ADR-026" }   # Trustee KBS/AS/RVPS: attested key release

  # ── Layers 3–5 · Core, workflow, OLTP data (profile: core) ─────────────────
  - { name: valkey,            ns: cache-tier,      kind: path, profile: core, wave: -2, pdf: "8" }
  - { name: tigerbeetle,       ns: database-tier,   kind: path, profile: core, wave: -2, pdf: "8" }
  - { name: yugabytedb,        ns: database-tier,   kind: helm, profile: core, wave: -2, pdf: "8", repo: https://charts.yugabyte.com, chart: yugabyte, version: 2.25.1 }
  - { name: db-init,           ns: database-tier,   kind: path, profile: core, wave: -1, pdf: "8" }
  - { name: temporal,          ns: temporal,        kind: helm, profile: core, wave: 0,  pdf: "6.1", repo: https://go.temporal.io/helm-charts, chart: temporal, version: 0.62.0 }
  - { name: flagd,             ns: core-platform,   kind: path, profile: core, wave: 0,  pdf: "6.3" }
  - { name: core-services,     ns: core-platform,   kind: path, profile: core, wave: 1,  pdf: "5.3" }
  - { name: discountai-pwa,    ns: core-platform,   kind: path, profile: core, wave: 2,  pdf: "ADR-020" }   # ShopBot / Buying Partner / Exchange OME PWAs

  # ── Audit / extra data stores (profile: data) ──────────────────────────────

  # ── Layer 2 · Hub (profile: hub) ───────────────────────────────────────────
  - { name: quinn-hub,         ns: quinn-hub,       kind: path, profile: hub, wave: 1, pdf: "5.2" }

  # ── Layers 6–7 · Streaming, CDC, replay (profile: streaming) ───────────────
  - { name: strimzi,           ns: streaming,       kind: helm, profile: streaming, wave: -3, pdf: "5.5", repo: https://strimzi.io/charts/, chart: strimzi-kafka-operator, version: 0.51.0 }   # newest; Kafka 4.1-4.2, still serves v1beta2
  - { name: kafka,             ns: streaming,       kind: path, profile: streaming, wave: -1, pdf: "5.5" }
  - { name: apicurio,          ns: streaming,       kind: path, profile: streaming, wave: -1, pdf: "5.10" }
  - { name: debezium,          ns: streaming,       kind: path, profile: streaming, wave: 0,  pdf: "5.5" }
  - { name: stream-services,   ns: core-platform,   kind: path, profile: streaming, wave: 1,  pdf: "5.3" }
  - { name: risingwave-sql,    ns: streaming,       kind: path, profile: streaming, wave: 2,  pdf: "5.5" }
  - { name: risingwave,        ns: streaming,       kind: helm, profile: streaming, wave: 0,  pdf: "5.5", repo: https://risingwavelabs.github.io/helm-charts/, chart: risingwave, version: 0.2.27 }
  - { name: flink-operator,    ns: streaming,       kind: helm, profile: streaming, wave: -3, pdf: "5.5", repo: https://archive.apache.org/dist/flink/flink-kubernetes-operator-1.16.1/, chart: flink-kubernetes-operator, version: 1.16.1 }
  - { name: flink-jobs,        ns: streaming,       kind: path, profile: streaming, wave: 1,  pdf: "5.5" }
  - { name: keda,              ns: streaming,       kind: helm, profile: streaming, wave: -3, pdf: "6.2", repo: https://kedacore.github.io/charts, chart: keda, version: 2.16.1 }
  - { name: keda-scalers,      ns: streaming,       kind: path, profile: streaming, wave: 2,  pdf: "6.2" }
  - { name: seatunnel,         ns: streaming,       kind: path, profile: streaming-extra, wave: 1, pdf: "5.5" }

  # ── Layer 8 · Lakehouse (profile: lakehouse) ───────────────────────────────
  - { name: seaweedfs,         ns: lakehouse,       kind: path, profile: streaming, wave: -2, pdf: "5.6" }   # in streaming: Flink checkpoints and the RisingWave state store need S3; lakehouse uses it too
  - { name: polaris,           ns: lakehouse,       kind: path, profile: lakehouse, wave: -1, pdf: "5.6" }
  - { name: trino,             ns: lakehouse,       kind: helm, profile: lakehouse, wave: 0,  pdf: "5.6", repo: https://trinodb.github.io/charts, chart: trino, version: 1.37.0 }
  - { name: superset,          ns: lakehouse,       kind: helm, profile: lakehouse, wave: 1,  pdf: "5.6", repo: https://apache.github.io/superset, chart: superset, version: 0.14.2 }
  - { name: analytics-jobs,    ns: lakehouse,       kind: path, profile: lakehouse, wave: 2,  pdf: "5.6" }
  - { name: flink-archive,     ns: streaming,       kind: path, profile: lakehouse, wave: 2,  pdf: "5.6" }   # event-archive Flink job; needs Polaris
  - { name: marquez,           ns: governance,      kind: path, profile: lakehouse-extra, wave: 1, pdf: "5.8" }   # lineage; replaces DataHub (owner 2026-11-20)

  # ── AI / ML plane (profile: ml) ────────────────────────────────────────────
  - { name: feast,             ns: ml-platform,     kind: path, profile: ml, wave: 0, pdf: "5.7" }
  # Vector search: pgvector on the shared Postgres (database "ml"), not Weaviate (owner 2026-11-20).
  - { name: onnx-serving,      ns: ml-platform,     kind: path, profile: ml, wave: 1, pdf: "5.7" }   # services/fraud-scorer
  - { name: mlflow,            ns: ml-platform,     kind: helm, profile: ml, wave: 0, pdf: "5.7", repo: https://community-charts.github.io/helm-charts, chart: mlflow, version: 0.17.2 }

  # ── Payment-rail simulators (profile: rails; owner 2026-11-21) ─────────────
  - { name: scheme-sim,        ns: rails,           kind: path, profile: rails, wave: 0, pdf: "rails" }   # card scheme + ISO 8583 adapter
  - { name: loan-origination,  ns: core-platform,   kind: path, profile: rails, wave: 0, pdf: "ADR-025" }   # loan workflows' endpoints (ConfigMap)
  - { name: card-security,     ns: rails,           kind: path, profile: rails, wave: 0, pdf: "rails" }   # security module (hsm) + 3DS ACS (ADR-026/027)
  - { name: fineract,          ns: rails,           kind: path, profile: rails, wave: 1, pdf: "rails" }   # CBS (Fineract 1.16.1, shared Postgres)
  - { name: hyperswitch,       ns: rails,           kind: path, profile: rails, wave: 1, pdf: "rails" }   # PSP (Hyperswitch v1.129.0, dummy connector)
  - { name: payment-hub,       ns: rails,           kind: path, profile: rails, wave: 2, pdf: "rails" }   # payment hub on Temporal (PSP + CBS)
  - { name: exchange-rails,    ns: core-platform,   kind: path, profile: rails, wave: 3, pdf: "rails" }   # exchange → payment hub link (ConfigMap)

  # ── Fraud and AML monitoring (profile: fraud; owner 2026-11-22, ADR-023) ─────
  - { name: tazama,            ns: fraud,           kind: path, profile: fraud, wave: 2, pdf: "5.7" }   # Tazama on Kafka, shared Postgres/Valkey

  # ── Layers 9–10 · Observability + FinOps (profile: observability) ──────────
  - { name: victoria-metrics,  ns: observability,   kind: helm, profile: observability, wave: -1, pdf: "10", repo: https://victoriametrics.github.io/helm-charts, chart: victoria-metrics-k8s-stack, version: 0.39.0 }
  - { name: loki,              ns: observability,   kind: helm, profile: observability, wave: 0,  pdf: "10", repo: https://grafana.github.io/helm-charts, chart: loki, version: 6.29.0 }
  - { name: tempo,             ns: observability,   kind: helm, profile: observability, wave: 0,  pdf: "10", repo: https://grafana.github.io/helm-charts, chart: tempo, version: 1.18.3 }
  - { name: pyroscope,         ns: observability,   kind: helm, profile: observability, wave: 0,  pdf: "10.2", repo: https://grafana.github.io/helm-charts, chart: pyroscope, version: 1.13.2 }
  - { name: alloy,             ns: observability,   kind: helm, profile: observability, wave: 1,  pdf: "10", repo: https://grafana.github.io/helm-charts, chart: alloy, version: 1.0.1 }
  - { name: dashboards,        ns: observability,   kind: path, profile: observability, wave: 2,  pdf: "10.4" }
  - { name: canary-gates,      ns: core-platform,   kind: path, profile: observability, wave: 3,  pdf: "4.5" }   # Rollouts need VictoriaMetrics
  - { name: opencost,          ns: opencost,        kind: helm, profile: observability, wave: 1,  pdf: "16", repo: https://opencost.github.io/opencost-helm-chart, chart: opencost, version: 2.0.2 }

  # ── Forms + business processes (profile: process, ADR-008) ────────────────
  - { name: postgres-docdb,    ns: database-tier,   kind: path, profile: core,    wave: -2, pdf: "ADR-019" }
  - { name: ferretdb,          ns: forms,           kind: path, profile: process, wave: -1, pdf: "ADR-008" }
  - { name: formio,            ns: forms,           kind: path, profile: process, wave: 0,  pdf: "ADR-008" }
  - { name: fluxnova,          ns: process,         kind: path, profile: process, wave: 0,  pdf: "ADR-008" }
  - { name: process-models,    ns: process,         kind: path, profile: process, wave: 1,  pdf: "ADR-008" }
  - { name: process-gateway,   ns: process,         kind: path, profile: process, wave: 1,  pdf: "ADR-008" }

  # ── Back-office (profile: backoffice) ──────────────────────────────────────
  - { name: backoffice-web,    ns: back-office-ui,  kind: path, profile: backoffice, wave: 1, pdf: "5.9" }

  # ── CI / supply chain / backup (profile: platform-ops) ─────────────────────
  - { name: tekton,            ns: tekton-pipelines, kind: path, profile: platform-ops, wave: -1, pdf: "4.5" }
  - { name: harbor,            ns: harbor,          kind: helm, profile: platform-ops, wave: 0, pdf: "11.2", repo: https://helm.goharbor.io, chart: harbor, version: 1.16.2 }
  - { name: k6-operator,       ns: k6,              kind: helm, profile: platform-ops, wave: 0, pdf: "4.5", repo: https://grafana.github.io/helm-charts, chart: k6-operator, version: 3.11.1 }
  - { name: velero,            ns: backup,          kind: helm, profile: platform-ops, wave: 0, pdf: "4.1", repo: https://vmware-tanzu.github.io/helm-charts, chart: velero, version: 8.5.0 }
