apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: superset
  namespace: argocd
  labels:
    difme/profile: lakehouse
    difme/pdf-section: '5.6'
  annotations:
    argocd.argoproj.io/sync-wave: '1'
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: difme
  destination:
    server: https://kubernetes.default.svc
    namespace: lakehouse
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
  - group: apps
    kind: Deployment
    name: superset
    jsonPointers:
    - /spec/replicas
  - group: apps
    kind: Deployment
    name: superset-worker
    jsonPointers:
    - /spec/replicas
  sources:
  - repoURL: https://apache.github.io/superset
    chart: superset
    targetRevision: 0.14.2
    helm:
      releaseName: superset
      valueFiles:
      - $values/deploy/platform/lakehouse/superset/values.yaml
  - repoURL: https://github.com/pratikmohanty1994-ui/difme.git
    targetRevision: main
    ref: values
