apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: risingwave
  namespace: argocd
  labels:
    difme/profile: streaming
    difme/pdf-section: '5.5'
  annotations:
    argocd.argoproj.io/sync-wave: '0'
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: difme
  destination:
    server: https://kubernetes.default.svc
    namespace: streaming
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
  sources:
  - repoURL: https://risingwavelabs.github.io/helm-charts/
    chart: risingwave
    targetRevision: 0.2.27
    helm:
      releaseName: risingwave
      valueFiles:
      - $values/deploy/platform/streaming/risingwave/values.yaml
  - repoURL: https://github.com/pratikmohanty1994-ui/difme.git
    targetRevision: main
    ref: values
