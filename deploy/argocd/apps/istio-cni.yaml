apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-cni
  namespace: argocd
  labels:
    difme/profile: security
    difme/pdf-section: '4.4'
  annotations:
    argocd.argoproj.io/sync-wave: '-4'
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: difme
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
  sources:
  - repoURL: https://blob.istio.io/istio-release/charts
    chart: cni
    targetRevision: 1.32.0
    helm:
      releaseName: istio-cni
      valueFiles:
      - $values/deploy/platform/istio-system/istio-cni/values.yaml
  - repoURL: https://github.com/pratikmohanty1994-ui/difme.git
    targetRevision: main
    ref: values
