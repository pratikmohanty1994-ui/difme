apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: yugabytedb
  namespace: argocd
  labels:
    difme/profile: core
    difme/pdf-section: '8'
  annotations:
    argocd.argoproj.io/sync-wave: '-2'
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: difme
  destination:
    server: https://kubernetes.default.svc
    namespace: database-tier
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
  sources:
  - repoURL: https://charts.yugabyte.com
    chart: yugabyte
    targetRevision: 2.25.1
    helm:
      releaseName: yugabytedb
      valueFiles:
      - $values/deploy/platform/database-tier/yugabytedb/values.yaml
  - repoURL: https://github.com/pratikmohanty1994-ui/difme.git
    targetRevision: main
    ref: values
