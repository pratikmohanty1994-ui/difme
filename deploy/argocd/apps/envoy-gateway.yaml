apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-gateway
  namespace: argocd
  labels:
    difme/profile: base
    difme/pdf-section: '4.3'
  annotations:
    argocd.argoproj.io/sync-wave: '-6'
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: difme
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
  - group: rbac.authorization.k8s.io
    kind: ClusterRole
    jqPathExpressions:
    - .rules
  - group: rbac.authorization.k8s.io
    kind: ClusterRoleBinding
    jqPathExpressions:
    - .subjects
  sources:
  - repoURL: docker.io/envoyproxy
    chart: gateway-helm
    targetRevision: v1.4.0
    helm:
      releaseName: envoy-gateway
      valueFiles:
      - $values/deploy/platform/ingress-system/envoy-gateway/values.yaml
  - repoURL: https://github.com/pratikmohanty1994-ui/difme.git
    targetRevision: main
    ref: values
