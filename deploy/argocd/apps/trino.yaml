apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trino
  namespace: argocd
  labels:
    difme/profile: lakehouse
    difme/pdf-section: '5.6'
  annotations:
    argocd.argoproj.io/sync-wave: '0'
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: difme
  destination:
    server: https://kubernetes.default.svc
    namespace: lakehouse
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    - RespectIgnoreDifferences=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
  ignoreDifferences:
  - group: apps
    kind: Deployment
    name: trino-coordinator
    jsonPointers:
    - /spec/replicas
  sources:
  - repoURL: https://trinodb.github.io/charts
    chart: trino
    targetRevision: 1.37.0
    helm:
      releaseName: trino
      valueFiles:
      - $values/deploy/platform/lakehouse/trino/values.yaml
  - repoURL: https://github.com/pratikmohanty1994-ui/difme.git
    targetRevision: main
    ref: values
