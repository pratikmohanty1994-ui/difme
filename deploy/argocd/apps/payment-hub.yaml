apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: payment-hub
  namespace: argocd
  labels:
    difme/profile: rails
    difme/pdf-section: rails
  annotations:
    argocd.argoproj.io/sync-wave: '2'
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: difme
  destination:
    server: https://kubernetes.default.svc
    namespace: rails
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
    - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
  source:
    repoURL: https://github.com/pratikmohanty1994-ui/difme.git
    targetRevision: main
    path: deploy/platform/rails/payment-hub
