# Real clusters: records in the site's own DNS server through RFC 2136 dynamic updates (BIND, Knot or PowerDNS; no
# cloud DNS vendor lock-in), signed with a TSIG key from Secret external-dns-tsig (key "secret", created from OpenBao).
provider: { name: rfc2136 }
extraArgs:
  - --rfc2136-host=dns.difme.internal
  - --rfc2136-port=53
  - --rfc2136-zone=difme.local
  - --rfc2136-tsig-keyname=externaldns
  - --rfc2136-tsig-secret-alg=hmac-sha256
  - --rfc2136-tsig-axfr
env:
  - name: EXTERNAL_DNS_RFC2136_TSIG_SECRET
    valueFrom: { secretKeyRef: { name: external-dns-tsig, key: secret } }
