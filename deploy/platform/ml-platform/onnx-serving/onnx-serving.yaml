# PDF §5.7 — server-side ONNX Runtime fraud scoring (fallback when edge attestation fails, §11.1 FAIL path).
# services/fraud-scorer: the model (ml/fraud/train.py) and libonnxruntime are baked into the image, so the pod needs no
# object store or network at start. Measured 2026-11-20 (release build, local): 36 MiB RSS, 1 thread.
# POST /v1/score takes the six features; POST /v1/score/order takes accountId/deviceId/amountMinor and reads them from
# the Feast online store (tested against Feast 0.67 `feast serve`: ~7 ms per order). Next: promoted models from MLflow.
apiVersion: v1
kind: ServiceAccount
metadata: { name: onnx-serving }
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: onnx-serving, labels: { app: onnx-serving } }
spec:
  replicas: 1
  selector: { matchLabels: { app: onnx-serving } }
  template:
    metadata: { labels: { app: onnx-serving, difme/team: ml, business.metric: fraud-check } }
    spec:
      serviceAccountName: onnx-serving
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: scorer
          image: ghcr.io/pratikmohanty1994-ui/difme-fraud-scorer:0.1.0
          env: [{ name: FEAST_URL, value: "http://feast-server.ml-platform.svc:6566" }]
          ports: [{ containerPort: 8090 }]
          readinessProbe: { httpGet: { path: /healthz, port: 8090 }, periodSeconds: 10 }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          resources: { requests: { cpu: 10m, memory: 48Mi }, limits: { memory: 128Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: onnx-serving }
spec: { selector: { app: onnx-serving }, ports: [{ port: 8090 }] }
