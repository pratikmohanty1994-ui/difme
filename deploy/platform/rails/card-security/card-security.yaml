# Card security (ADR-026, ADR-027): the security module (services/hsm, jPOS) and the 3-D Secure ACS
# (services/scheme-sim cmd/acs). The hsm answers only the ACS and scheme-sim (AuthorizationPolicy); it returns no keys.
# Keys: only through attested key release. The hsm attests to Trustee's KBS (security/tee-key-release) and receives its
# LMK, KBPK and key list as JWE to its TEE key, in memory; on the very first start (nothing in OpenBao yet) it generates
# them itself and stores them through a create-only OpenBao role. No key material in Secrets, env or disk; the ACS holds
# none (signing and HMAC are hsm calls). TEE: Trustee's emulated "sample" TEE in development (HSM_TEE_SVN stands in for
# the build's measurement); Confidential Containers on SEV-SNP/TDX nodes in production (runtimeClassName kata-cc).
apiVersion: v1
kind: ServiceAccount
metadata: { name: hsm }
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: hsm, labels: { app: hsm } }
spec:
  replicas: 1
  selector: { matchLabels: { app: hsm } }
  template:
    metadata: { labels: { app: hsm, difme/team: rails, business.metric: security-module } }
    spec:
      serviceAccountName: hsm
      securityContext: { runAsNonRoot: true, runAsUser: 185, runAsGroup: 185, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: hsm
          image: ghcr.io/pratikmohanty1994-ui/difme-hsm:0.1.0
          env:
            - { name: HSM_KBS_URL, value: "http://trustee-kbs.security.svc:8080" }
            - { name: HSM_TEE_SVN, value: "1" }          # emulated TEE: the measurement registered in Trustee (dev)
            - { name: HSM_TMPFS, value: /run/hsm }
            - { name: HSM_BOOTSTRAP_OPENBAO, value: "http://openbao.security.svc:8200" }
            - { name: HSM_BOOTSTRAP_KEYS, value: "card-index=AES/M7;card-vault=AES/D0;cvk=CVK;dcvv2=CVK;zpk=ZPK;pvk=PVK;imk-ac=MK-AC;imk-smi=MK-SMI;imk-smc=MK-SMC;imk-cvc3=MK-CVC3;tak=TAK;aes-pin=AES/P0;aes-mac=AES/M7;acs-hmac=AES/M7;acs-sign=RSA;nts-jwe=RSA-ENC;issuer-rsa=RSA-EMV/1408;perso-kek=ZMK" }
            - { name: JAVA_TOOL_OPTIONS, value: "-XX:MaxRAMPercentage=70 -XX:+DisableAttachMechanism -XX:-CreateCoredumpOnCrash" }
          ports: [{ name: http, containerPort: 8700 }]
          readinessProbe: { httpGet: { path: /healthz, port: 8700 }, periodSeconds: 10 }
          volumeMounts:
            - { name: run, mountPath: /run/hsm }
            - { name: tmp, mountPath: /tmp }
            - { name: openbao-token, mountPath: /var/run/secrets/openbao, readOnly: true }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          resources: { requests: { cpu: 20m, memory: 128Mi }, limits: { memory: 256Mi } }
      volumes:
        - { name: run, emptyDir: { medium: Memory, sizeLimit: 1Mi } }   # LMK never on disk
        - { name: tmp, emptyDir: { medium: Memory, sizeLimit: 16Mi } }
        - name: openbao-token   # used only on the first start (create-only role hsm-bootstrap)
          projected: { sources: [{ serviceAccountToken: { audience: vault, expirationSeconds: 600, path: token } }] }
---
apiVersion: v1
kind: Service
metadata: { name: hsm }
spec:
  selector: { app: hsm }
  ports: [{ name: http, port: 8700 }]
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: acs }
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: acs, labels: { app: acs } }
spec:
  replicas: 1                       # pending challenges live in this process (durable store: ADR-027 open item)
  selector: { matchLabels: { app: acs } }
  template:
    metadata: { labels: { app: acs, difme/team: rails, business.metric: acs-3ds } }
    spec:
      serviceAccountName: acs
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: acs
          image: ghcr.io/pratikmohanty1994-ui/difme-scheme-sim:0.1.0
          command: [/usr/local/bin/acs]
          env:
            - { name: ACS_ADDR, value: ":8090" }
            - { name: ACS_CMS_URL, value: "http://card-issuer.rails.svc:8080" }
            - { name: HSM_URL, value: "http://hsm.rails.svc:8700" }
            - { name: TAZAMA_TMS_URL, value: "http://tazama-tms.fraud.svc:3000" }
            - { name: TAZAMA_ADMIN_URL, value: "http://tazama-admin-service.fraud.svc:3100" }
            - { name: ACS_CHALLENGE_URL, value: "https://acs.difme.local/3ds/challenge" }
            # Passcodes by email and email-to-SMS through Mailpit (development stand-in for the bank's mail relay and
            # SMS gateway): read them at http://mailpit.rails.svc:8025.
            - { name: ACS_SMTP_ADDR, value: "mailpit.rails.svc:1025" }
          ports: [{ name: http, containerPort: 8090 }]
          readinessProbe: { httpGet: { path: /healthz, port: 8090 }, periodSeconds: 10 }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          resources: { requests: { cpu: 10m, memory: 16Mi }, limits: { memory: 64Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: acs }
spec:
  selector: { app: acs }
  ports: [{ name: http, port: 8090 }]
---
# Mailpit v1.24.1 (MIT): catches the ACS's passcode emails and email-to-SMS messages in development, with a web inbox
# on 8025. Messages are kept in memory only (pod restart empties the inbox). Not for production: there the ACS points
# ACS_SMTP_ADDR at the bank's relay.
apiVersion: v1
kind: ServiceAccount
metadata: { name: mailpit }
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: mailpit, labels: { app: mailpit } }
spec:
  replicas: 1
  selector: { matchLabels: { app: mailpit } }
  template:
    metadata: { labels: { app: mailpit, difme/team: rails, business.metric: acs-3ds } }
    spec:
      serviceAccountName: mailpit
      securityContext: { runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: mailpit
          image: axllent/mailpit:v1.24.1
          env:
            - { name: MP_MAX_MESSAGES, value: "500" }
            - { name: MP_SMTP_AUTH_ACCEPT_ANY, value: "true" }
            - { name: MP_SMTP_AUTH_ALLOW_INSECURE, value: "true" }
          ports: [{ name: smtp, containerPort: 1025 }, { name: http, containerPort: 8025 }]
          readinessProbe: { httpGet: { path: /readyz, port: 8025 }, periodSeconds: 10 }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          resources: { requests: { cpu: 5m, memory: 16Mi }, limits: { memory: 64Mi } }
      volumes:
        - { name: tmp, emptyDir: { medium: Memory, sizeLimit: 32Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: mailpit }
spec:
  selector: { app: mailpit }
  ports: [{ name: smtp, port: 1025 }, { name: http, port: 8025 }]
---
# Only the ACS may send mail; the inbox (8025) is open inside the mesh for developers.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata: { name: mailpit-senders }
spec:
  selector: { matchLabels: { app: mailpit } }
  action: ALLOW
  rules:
    - from: [{ source: { principals: ["difme.local/ns/rails/sa/acs"] } }]
      to: [{ operation: { ports: ["1025"] } }]
    - to: [{ operation: { ports: ["8025"] } }]
---
# Only the ACS and the authorisation switch may call the security module (ztunnel enforces the mesh identity; probes are plain kubelet).
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata: { name: hsm-callers }
spec:
  selector: { matchLabels: { app: hsm } }
  action: ALLOW
  rules:
    - from: [{ source: { principals: ["difme.local/ns/rails/sa/acs", "difme.local/ns/rails/sa/scheme-sim", "difme.local/ns/rails/sa/card-issuer"] } }]
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: card-issuer }
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: card-issuer, labels: { app: card-issuer } }
spec:
  replicas: 1                       # one decision at a time per card (open-to-buy); scale-out needs a per-card lock in Postgres
  selector: { matchLabels: { app: card-issuer } }
  template:
    metadata: { labels: { app: card-issuer, difme/team: rails, business.metric: card-issuer } }
    spec:
      serviceAccountName: card-issuer
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: card-issuer
          image: ghcr.io/pratikmohanty1994-ui/difme-card-issuer:0.1.0
          env:
            - { name: ADDR, value: ":8080" }
            - { name: BIN, value: "437551" }
            - { name: HSM_URL, value: "http://hsm.rails.svc:8700" }
            - { name: FINERACT_URL, value: "http://fineract.rails.svc:8080/fineract-provider" }
            - { name: FINERACT_TOKEN_URL, value: "http://keycloak.security.svc:8080/realms/difme/protocol/openid-connect/token" }
            - { name: FINERACT_CLIENT_ID, valueFrom: { secretKeyRef: { name: card-issuer-oauth, key: client-id } } }
            - { name: FINERACT_CLIENT_SECRET, valueFrom: { secretKeyRef: { name: card-issuer-oauth, key: client-secret } } }
            - { name: DB_PASSWORD, valueFrom: { secretKeyRef: { name: card-issuer-db, key: password } } }
            - { name: DATABASE_URL, value: "postgres://card_issuer:$(DB_PASSWORD)@postgres-docdb.database-tier.svc:5432/card_issuer" }
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /healthz, port: 8080 }, periodSeconds: 10 }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          resources: { requests: { cpu: 10m, memory: 16Mi }, limits: { memory: 96Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: card-issuer }
spec:
  selector: { app: card-issuer }
  ports: [{ name: http, port: 8080 }]
---
# Card operations: the switch (authorisations), the ACS (card lookups) and DIFME's own services in core-platform.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata: { name: card-issuer-callers }
spec:
  selector: { matchLabels: { app: card-issuer } }
  action: ALLOW
  rules:
    - from: [{ source: { principals: ["difme.local/ns/rails/sa/scheme-sim", "difme.local/ns/rails/sa/acs"] } }]
    - from: [{ source: { namespaces: ["core-platform"] } }]
