# Juspay Hyperswitch v1.129.0: the PSP simulator (payment aggregator / gateway) for merchants and agents (owner
# 2026-11-21). Payments run through its dummy connector (a simulated processor); test cards only. Shared Postgres
# (database "hyperswitch", 95-hyperswitch.sh) and the shared Valkey. Upstream config file, DIFME values as ROUTER__* env.
apiVersion: v1
kind: ServiceAccount
metadata: { name: hyperswitch }
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: hyperswitch, labels: { app: hyperswitch } }
spec:
  replicas: 1
  selector: { matchLabels: { app: hyperswitch } }
  template:
    metadata:
      labels: { app: hyperswitch, difme/team: rails, business.metric: psp-sim }
      # Secrets come from OpenBao (component reuse), not Kubernetes Secrets: OpenBao's agent injector adds an init
      # container that logs in with this pod's service account (role hyperswitch, read-only on its own path) and
      # writes them to an in-memory file, which the containers below read at start. No agent keeps running.
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/agent-pre-populate-only: "true"
        vault.hashicorp.com/agent-init-first: "true"                                 # before the migrate step
        vault.hashicorp.com/role: hyperswitch
        vault.hashicorp.com/agent-service-account-token-volume-name: openbao-token    # audience "vault", 10 min
        vault.hashicorp.com/agent-requests-cpu: 10m
        vault.hashicorp.com/agent-requests-mem: 16Mi
        vault.hashicorp.com/agent-limits-mem: 64Mi
        vault.hashicorp.com/agent-inject-secret-router.env: secret/data/rails/hyperswitch
        vault.hashicorp.com/agent-inject-template-router.env: |
          {{- with secret "secret/data/rails/hyperswitch" }}
          PGPASSWORD='{{ .Data.data.db_password }}'
          ROUTER__MASTER_DATABASE__PASSWORD='{{ .Data.data.db_password }}'
          ROUTER__REPLICA_DATABASE__PASSWORD='{{ .Data.data.db_password }}'
          ROUTER__ACCOUNTS_DATABASE__PASSWORD='{{ .Data.data.db_password }}'
          ROUTER__GLOBAL_DATABASE__PASSWORD='{{ .Data.data.db_password }}'
          ROUTER__ANALYTICS__SQLX__PASSWORD='{{ .Data.data.db_password }}'
          ROUTER__SECRETS__ADMIN_API_KEY='{{ .Data.data.admin_api_key }}'
          ROUTER__SECRETS__JWT_SECRET='{{ .Data.data.jwt_secret }}'
          ROUTER__SECRETS__MASTER_ENC_KEY='{{ .Data.data.master_enc_key }}'
          ROUTER__API_KEYS__HASH_KEY='{{ .Data.data.api_key_hash_key }}'
          {{- end }}
        # Network tokenization (ADR-024): Hyperswitch's own JWE private key and the API key shared with the token service
        # (scheme-sim /nts). Empty when the values aren't in OpenBao; the router then runs without network tokens.
        vault.hashicorp.com/agent-inject-secret-nts.env: secret/data/rails/hyperswitch
        vault.hashicorp.com/agent-inject-template-nts.env: |
          {{- with secret "secret/data/rails/hyperswitch" }}{{- if .Data.data.nts_private_key_b64 }}
          ROUTER__NETWORK_TOKENIZATION_SERVICE__TOKEN_SERVICE_API_KEY='{{ .Data.data.nts_api_key }}'
          ROUTER__NETWORK_TOKENIZATION_SERVICE__WEBHOOK_SOURCE_VERIFICATION_KEY='{{ .Data.data.nts_webhook_key }}'
          ROUTER__NETWORK_TOKENIZATION_SERVICE__PRIVATE_KEY='{{ base64Decode .Data.data.nts_private_key_b64 }}'
          {{- end }}{{- end }}
    spec:
      serviceAccountName: hyperswitch
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      initContainers:
        # Schema first: applies only the migrations not yet recorded (idempotent), then the router starts.
        - name: migrate
          image: ghcr.io/pratikmohanty1994-ui/difme-hyperswitch:0.1.0
          command: [bash, -c, 'set -a; . /vault/secrets/router.env; set +a; until pg_isready -q -h postgres-docdb.database-tier.svc; do sleep 3; done; exec /local/bin/migrate.sh']
          env:
            - { name: DATABASE_URL, value: "postgresql://hyperswitch@postgres-docdb.database-tier.svc:5432/hyperswitch" }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          resources: { requests: { cpu: 20m, memory: 32Mi }, limits: { memory: 128Mi } }
        # The token service's encryption public key (its private half stays in the security module, key nts-jwe), from
        # scheme-sim, which publishes it. Writes the non-secret network tokenization settings only when the key is
        # there; otherwise (token service not configured or not up within 5 minutes) payments start without them.
        - name: nts-public-key
          image: curlimages/curl:8.11.1
          command: [sh, -c]
          args:
            - |
              NTS=http://scheme-sim.rails.svc:8080/nts
              : > /nts/public.env
              for i in $(seq 60); do
                if PEM=$(curl -sf "$NTS/public-key") && [ -n "$PEM" ]; then
                  { echo "ROUTER__NETWORK_TOKENIZATION_SERVICE__PUBLIC_KEY='$PEM'"
                    echo "ROUTER__NETWORK_TOKENIZATION_SERVICE__KEY_ID=nts-jwe"
                    for u in generate_token_url=generate fetch_token_url=token delete_token_url=delete check_token_status_url=status \
                             check_tokenize_eligibility_url=eligibility fetch_altid_url=altid; do
                      echo "ROUTER__NETWORK_TOKENIZATION_SERVICE__$(echo "${u%%=*}" | tr a-z A-Z)=$NTS/${u#*=}"
                    done; } > /nts/public.env
                  echo "network tokenization service key fetched"; exit 0
                fi
                sleep 5
              done
              echo "token service public key not available: starting without network tokenization"
          volumeMounts: [{ name: nts, mountPath: /nts }]
          # curlimages' user is named (curl_user), so runAsNonRoot needs its numeric id (cluster-verify 2026-11-23).
          securityContext: { runAsUser: 100, runAsGroup: 101, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          resources: { requests: { cpu: 10m, memory: 16Mi }, limits: { memory: 64Mi } }
      containers:
        - name: router
          image: ghcr.io/pratikmohanty1994-ui/difme-hyperswitch:0.1.0
          # Network tokenization only with both halves (secret settings from OpenBao, public key and URLs from the init
          # container): a partial [network_tokenization_service] section would stop the router from starting.
          command: [bash, -c, 'set -a; . /vault/secrets/router.env; if [ -s /nts/public.env ] && grep -q PRIVATE_KEY /vault/secrets/nts.env; then . /vault/secrets/nts.env; . /nts/public.env; echo "network tokenization on"; fi; set +a; exec /local/bin/router -f /local/config/docker_compose.toml']
          env:
            - { name: ROUTER__MASTER_DATABASE__HOST, value: postgres-docdb.database-tier.svc }
            - { name: ROUTER__MASTER_DATABASE__USERNAME, value: hyperswitch }
            - { name: ROUTER__MASTER_DATABASE__DBNAME, value: hyperswitch }
            - { name: ROUTER__MASTER_DATABASE__MAX_POOL_SIZE, value: "10" }
            - { name: ROUTER__REPLICA_DATABASE__HOST, value: postgres-docdb.database-tier.svc }
            - { name: ROUTER__REPLICA_DATABASE__USERNAME, value: hyperswitch }
            - { name: ROUTER__REPLICA_DATABASE__DBNAME, value: hyperswitch }
            - { name: ROUTER__REPLICA_DATABASE__MAX_POOL_SIZE, value: "10" }
            - { name: ROUTER__ACCOUNTS_DATABASE__HOST, value: postgres-docdb.database-tier.svc }
            - { name: ROUTER__ACCOUNTS_DATABASE__USERNAME, value: hyperswitch }
            - { name: ROUTER__ACCOUNTS_DATABASE__DBNAME, value: hyperswitch }
            - { name: ROUTER__ACCOUNTS_DATABASE__MAX_POOL_SIZE, value: "3" }
            - { name: ROUTER__GLOBAL_DATABASE__HOST, value: postgres-docdb.database-tier.svc }
            - { name: ROUTER__GLOBAL_DATABASE__USERNAME, value: hyperswitch }
            - { name: ROUTER__GLOBAL_DATABASE__DBNAME, value: hyperswitch }
            - { name: ROUTER__GLOBAL_DATABASE__MAX_POOL_SIZE, value: "3" }
            - { name: ROUTER__ANALYTICS__SQLX__HOST, value: postgres-docdb.database-tier.svc }
            - { name: ROUTER__ANALYTICS__SQLX__USERNAME, value: hyperswitch }
            - { name: ROUTER__ANALYTICS__SQLX__DBNAME, value: hyperswitch }
            - { name: ROUTER__ANALYTICS__SQLX__MAX_POOL_SIZE, value: "3" }
            - { name: ROUTER__REDIS__HOST, value: valkey.cache-tier.svc }
            - { name: ROUTER__REDIS__POOL_SIZE, value: "3" }
            # Card payments: the test processor's calls go to DIFME's acquirer, which sends them over ISO 8583 to the scheme.
            - { name: ROUTER__CONNECTORS__DUMMYCONNECTOR__BASE_URL, value: "http://iso-adapter.rails.svc:8080/dummy-connector" }
            # Network tokens for DIFME's test processor too (upstream lists only real connectors).
            - { name: ROUTER__NETWORK_TOKENIZATION_SUPPORTED_CONNECTORS__CONNECTOR_LIST, value: "adyen,cybersource,peachpayments,trustpay,phonypay,fauxpay,pretendpay,stripe_test,adyen_test,checkout_test,paypal_test" }
            - { name: ROUTER__LOG__CONSOLE__LEVEL, value: INFO }
            # Traces and metrics to DIFME's collector (Alloy, OTLP gRPC) → Tempo / VictoriaMetrics; not Hyperswitch's own stack.
            - { name: ROUTER__LOG__TELEMETRY__TRACES_ENABLED, value: "true" }
            - { name: ROUTER__LOG__TELEMETRY__METRICS_ENABLED, value: "true" }
            - { name: ROUTER__LOG__TELEMETRY__OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://alloy.observability.svc:4317" }
            - { name: ROUTER__LOG__TELEMETRY__SAMPLING_RATE, value: "0.1" }
            - { name: ROUTER__LOG__TELEMETRY__IGNORE_ERRORS, value: "true" }     # collector down must not stop payments
            - { name: ROUTER__SERVER__WORKERS, value: "2" }
            # Thread stacks: the router crate is built unoptimised (deploy/images/hyperswitch/Dockerfile: opt-level 0 to fit a
            # 16 GB build), and its payment path then overflowed the image's 6 MiB worker stacks: "fatal runtime error:
            # stack overflow, aborting" on every POST /payments (cluster run 28). Stack pages are only committed as used.
            - { name: RUST_MIN_STACK, value: "67108864" }
          ports: [{ name: http, containerPort: 8080 }]
          startupProbe: { httpGet: { path: /health, port: 8080 }, periodSeconds: 5, failureThreshold: 60 }
          # Shallow check: /health/ready is Hyperswitch's deep check, which also probes services DIFME doesn't run (analytics,
          # OpenSearch, gRPC, decision engine) and an outgoing request to the internet that egress policy blocks, so it
          # timed out on the first cluster run (2026-11-22). Database and Valkey failures surface on requests and logs.
          readinessProbe: { httpGet: { path: /health, port: 8080 }, periodSeconds: 15, timeoutSeconds: 5 }
          # Tolerant: the kubelet killed the router mid-payment when /health missed the default 1 s timeout (cluster runs
          # 29-31: two first payments held the 3-connection pools, and the pod's small CPU share slowed /health).
          livenessProbe: { httpGet: { path: /health, port: 8080 }, periodSeconds: 30, timeoutSeconds: 10, failureThreshold: 6 }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: nts, mountPath: /nts, readOnly: true }]
          resources: { requests: { cpu: 200m, memory: 160Mi }, limits: { memory: 512Mi } }
      volumes:
        - { name: nts, emptyDir: { medium: Memory, sizeLimit: 1Mi } }
        - name: openbao-token
          projected: { sources: [{ serviceAccountToken: { audience: vault, expirationSeconds: 600, path: token } }] }
---
apiVersion: v1
kind: Service
metadata: { name: hyperswitch }
spec: { selector: { app: hyperswitch }, ports: [{ name: http, port: 8080 }] }
---
# Puts Hyperswitch's bootstrap values (Kubernetes Secret "hyperswitch", made by dev-secrets.sh) into OpenBao once,
# before the router starts; afterwards OpenBao is the source and this job leaves an existing path alone. Its role may
# only create that path (policy hyperswitch-seeder), never read it back.
apiVersion: v1
kind: ServiceAccount
metadata: { name: hyperswitch-seeder, annotations: { argocd.argoproj.io/hook: PreSync, argocd.argoproj.io/sync-wave: "-1", argocd.argoproj.io/hook-delete-policy: BeforeHookCreation } }
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: Job
metadata: { name: hyperswitch-openbao-seed, annotations: { argocd.argoproj.io/hook: PreSync, argocd.argoproj.io/hook-delete-policy: BeforeHookCreation } }
spec:
  backoffLimit: 30
  template:
    spec:
      serviceAccountName: hyperswitch-seeder
      restartPolicy: OnFailure
      securityContext: { runAsNonRoot: true, runAsUser: 100, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: seed
          image: curlimages/curl:8.11.1
          env:
            - { name: BAO_ADDR, value: "http://openbao.security.svc:8200" }
            - { name: DB_PASSWORD, valueFrom: { secretKeyRef: { name: hyperswitch, key: db-password } } }
            - { name: ADMIN_API_KEY, valueFrom: { secretKeyRef: { name: hyperswitch, key: admin-api-key } } }
            - { name: JWT_SECRET, valueFrom: { secretKeyRef: { name: hyperswitch, key: jwt-secret } } }
            - { name: MASTER_ENC_KEY, valueFrom: { secretKeyRef: { name: hyperswitch, key: master-enc-key } } }
            - { name: API_KEY_HASH_KEY, valueFrom: { secretKeyRef: { name: hyperswitch, key: api-key-hash-key } } }
            - { name: NTS_API_KEY, valueFrom: { secretKeyRef: { name: hyperswitch, key: nts-api-key } } }
            - { name: NTS_WEBHOOK_KEY, valueFrom: { secretKeyRef: { name: hyperswitch, key: nts-webhook-key } } }
            - { name: NTS_PRIVATE_KEY_B64, valueFrom: { secretKeyRef: { name: hyperswitch, key: nts-private-key-b64 } } }
          command: [sh, -c]
          args:
            - |
              set -eu
              JWT=$(cat /var/run/secrets/openbao/token)
              LOGIN=$(curl -sf -X POST "$BAO_ADDR/v1/auth/kubernetes/login" -d "{\"role\":\"hyperswitch-seeder\",\"jwt\":\"$JWT\"}")
              TOKEN=$(printf '%s' "$LOGIN" | sed -n 's/.*"client_token":"\([^"]*\)".*/\1/p')
              [ -n "$TOKEN" ] || { echo "OpenBao login failed"; exit 1; }
              if curl -sf -o /dev/null -H "X-Vault-Token: $TOKEN" "$BAO_ADDR/v1/secret/metadata/rails/hyperswitch"; then
                echo "secret/rails/hyperswitch already in OpenBao: left as it is"; exit 0
              fi
              # cas=0: written only if nobody wrote it in between. Values are random letters/digits/hex (no JSON escaping needed).
              code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "X-Vault-Token: $TOKEN" "$BAO_ADDR/v1/secret/data/rails/hyperswitch" \
                -d "{\"options\":{\"cas\":0},\"data\":{\"db_password\":\"$DB_PASSWORD\",\"admin_api_key\":\"$ADMIN_API_KEY\",\
              \"jwt_secret\":\"$JWT_SECRET\",\"master_enc_key\":\"$MASTER_ENC_KEY\",\"api_key_hash_key\":\"$API_KEY_HASH_KEY\",\
              \"nts_api_key\":\"$NTS_API_KEY\",\"nts_webhook_key\":\"$NTS_WEBHOOK_KEY\",\"nts_private_key_b64\":\"$NTS_PRIVATE_KEY_B64\"}}")
              [ "$code" = 200 ] || { echo "write refused: HTTP $code"; exit 1; }
              echo "secret/rails/hyperswitch written to OpenBao"
          volumeMounts: [{ name: openbao-token, mountPath: /var/run/secrets/openbao, readOnly: true }]
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          resources: { requests: { cpu: 10m, memory: 16Mi }, limits: { memory: 64Mi } }
      volumes:
        - name: openbao-token
          projected: { sources: [{ serviceAccountToken: { audience: vault, expirationSeconds: 600, path: token } }] }
