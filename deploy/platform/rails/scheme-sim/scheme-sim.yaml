# Card-scheme simulator (owner 2026-11-21: moov-io/iso8583, services/scheme-sim). ISO 8583 over TCP on 8583 for the
# ISO adapter; admin API on 8080 (test cards, issuer outages, processed messages). Test cards only.
apiVersion: v1
kind: ServiceAccount
metadata: { name: scheme-sim }
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: scheme-sim, labels: { app: scheme-sim } }
spec:
  replicas: 1                       # the card ledger lives in this process
  selector: { matchLabels: { app: scheme-sim } }
  template:
    metadata: { labels: { app: scheme-sim, difme/team: rails, business.metric: card-network-sim } }
    spec:
      serviceAccountName: scheme-sim
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: scheme-sim
          image: ghcr.io/pratikmohanty1994-ui/difme-scheme-sim:0.1.0
          command: [/usr/local/bin/scheme-sim]
          env:
            - { name: HSM_URL, value: "http://hsm.rails.svc:8700" }   # CAVV and TAVV checks (ADR-026/027)
            # Bank X (BIN 437551, the FR-01 offer BIN) cards for buying partners, plus another issuer.
            - name: SEED_CARDS
              value: >-
                [{"pan":"4375510000000001","expiry":"3012","limitMinor":5000000,"holder":"partner-1"},
                 {"pan":"4375510000000019","expiry":"3012","limitMinor":5000000,"holder":"partner-2"},
                 {"pan":"4375510000000027","expiry":"3012","limitMinor":100000,"holder":"low-limit partner"},
                 {"pan":"5200000000000007","expiry":"3012","limitMinor":5000000,"holder":"other issuer"}]
          ports: [{ name: iso, containerPort: 8583 }, { name: http, containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /healthz, port: 8080 }, periodSeconds: 10 }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          resources: { requests: { cpu: 10m, memory: 16Mi }, limits: { memory: 64Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: scheme-sim }
spec:
  selector: { app: scheme-sim }
  ports: [{ name: iso, port: 8583 }, { name: http, port: 8080 }]
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: iso-adapter }
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: iso-adapter, labels: { app: iso-adapter } }
spec:
  replicas: 1
  selector: { matchLabels: { app: iso-adapter } }
  template:
    metadata: { labels: { app: iso-adapter, difme/team: rails, business.metric: iso8583-adapter } }
    spec:
      serviceAccountName: iso-adapter
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: iso-adapter
          image: ghcr.io/pratikmohanty1994-ui/difme-scheme-sim:0.1.0
          command: [/usr/local/bin/iso-adapter]
          env:
            - { name: NETWORK_ADDR, value: "scheme-sim.rails.svc:8583" }
            # Acquirer for the PSP simulator (/dummy-connector): Hyperswitch's connector account sends this api-key.
            - { name: ACQUIRER_API_KEY, valueFrom: { secretKeyRef: { name: hyperswitch, key: acquirer-api-key } } }
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /healthz, port: 8080 }, periodSeconds: 15 }   # an ISO echo test to the network
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          resources: { requests: { cpu: 10m, memory: 16Mi }, limits: { memory: 64Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: iso-adapter }
spec: { selector: { app: iso-adapter }, ports: [{ name: http, port: 8080 }] }
