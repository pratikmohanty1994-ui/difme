# Apache Fineract 1.16.1: the core banking (CBS) simulator (owner 2026-11-21). Accounts, loans and savings for buyers'
# and buying partners' bank sides. Databases on the shared Postgres (90-fineract.sh); plain HTTP inside the mesh.
apiVersion: v1
kind: ServiceAccount
metadata: { name: fineract }
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: fineract, labels: { app: fineract } }
spec:
  replicas: 1
  selector: { matchLabels: { app: fineract } }
  template:
    metadata:
      labels: { app: fineract, difme/team: rails, business.metric: core-banking-sim, difme/metrics: "true" }
      annotations: { difme/metrics-path: /fineract-provider/actuator/prometheus }   # scraped into VictoriaMetrics (observability/dashboards/scrape.yaml)
    spec:
      serviceAccountName: fineract
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      initContainers:
        - name: wait-db
          image: ghcr.io/pratikmohanty1994-ui/difme-fineract:0.1.0
          command: [bash, -c, 'until (exec 3<>/dev/tcp/postgres-docdb.database-tier.svc/5432) 2>/dev/null; do sleep 3; done']
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          resources: { requests: { cpu: 10m, memory: 16Mi }, limits: { memory: 64Mi } }
      containers:
        - name: fineract
          image: ghcr.io/pratikmohanty1994-ui/difme-fineract:0.1.0
          env:
            - { name: FINERACT_NODE_ID, value: "1" }
            - { name: FINERACT_SERVER_SSL_ENABLED, value: "false" }
            - { name: FINERACT_SERVER_PORT, value: "8080" }
            - { name: FINERACT_HIKARI_DRIVER_SOURCE_CLASS_NAME, value: org.postgresql.Driver }
            - { name: FINERACT_HIKARI_JDBC_URL, value: "jdbc:postgresql://postgres-docdb.database-tier.svc:5432/fineract_tenants" }
            - { name: FINERACT_HIKARI_USERNAME, value: fineract }
            - { name: FINERACT_HIKARI_PASSWORD, valueFrom: { secretKeyRef: { name: fineract-db, key: password } } }
            - { name: FINERACT_HIKARI_MINIMUM_IDLE, value: "1" }
            - { name: FINERACT_HIKARI_MAXIMUM_POOL_SIZE, value: "5" }    # shared Postgres: keep the pool small
            - { name: FINERACT_DEFAULT_TENANTDB_HOSTNAME, value: postgres-docdb.database-tier.svc }
            - { name: FINERACT_DEFAULT_TENANTDB_PORT, value: "5432" }
            - { name: FINERACT_DEFAULT_TENANTDB_UID, value: fineract }
            - { name: FINERACT_DEFAULT_TENANTDB_PWD, valueFrom: { secretKeyRef: { name: fineract-db, key: password } } }
            - { name: FINERACT_DEFAULT_TENANTDB_NAME, value: fineract_default }
            - { name: FINERACT_DEFAULT_TENANTDB_IDENTIFIER, value: default }
            - { name: FINERACT_DEFAULT_TENANTDB_TIMEZONE, value: Asia/Kolkata }
            - { name: FINERACT_DEFAULT_MASTER_PASSWORD, valueFrom: { secretKeyRef: { name: fineract-db, key: master-password } } }
            - { name: FINERACT_MANAGEMENT_ENDPOINT_WEB_EXPOSURE_INCLUDE, value: "health,info,prometheus" }
            # Client documents and images on DIFME's object store (SeaweedFS S3), not the pod's disk.
            - { name: FINERACT_CONTENT_FILESYSTEM_ENABLED, value: "false" }
            - { name: FINERACT_CONTENT_S3_ENABLED, value: "true" }
            - { name: FINERACT_CONTENT_S3_BUCKET_NAME, value: fineract }
            - { name: FINERACT_CONTENT_S3_ENDPOINT, value: "http://seaweedfs-s3.lakehouse.svc:8333" }
            - { name: FINERACT_CONTENT_S3_REGION, value: us-east-1 }
            - { name: FINERACT_CONTENT_S3_PATH_STYLE_ADDRESSING_ENABLED, value: "true" }
            - { name: FINERACT_CONTENT_S3_ACCESS_KEY, valueFrom: { secretKeyRef: { name: fineract-s3, key: access-key } } }
            - { name: FINERACT_CONTENT_S3_SECRET_KEY, valueFrom: { secretKeyRef: { name: fineract-s3, key: secret-key } } }
            - { name: FINERACT_CONTENT_FILESYSTEM_ROOT_FOLDER, value: /tmp }
            # Logins come from Keycloak (component reuse): Fineract checks Keycloak's signature and maps the token's
            # fineract_user claim to one of its own users (no auto-create, so only users made by the bootstrap job get in).
            # Basic auth stays switched on only because Fineract 1.16 needs its beans to start; the OIDC filter chain owns
            # /api/** first, so passwords (including the built-in default login) are refused there (checked: 401).
            # The OIDC config and its issuer resolver depend on each other (upstream bug): Spring's switch allows it.
            - { name: SPRING_MAIN_ALLOW_CIRCULAR_REFERENCES, value: "true" }
            - { name: FINERACT_SECURITY_OIDC_FEDERATION_ENABLED, value: "true" }
            - { name: FINERACT_SECURITY_OIDC_USERNAME_CLAIM, value: fineract_user }
            - { name: FINERACT_SECURITY_OIDC_PROVIDER, value: keycloak }
            - { name: FINERACT_SECURITY_OIDCFEDERATION_ISSUERS_0_ISSUERURI, value: "https://id.difme.local/realms/difme" }
            - { name: FINERACT_SECURITY_OIDCFEDERATION_ISSUERS_0_TENANTID, value: default }
            - { name: FINERACT_SECURITY_OIDCFEDERATION_ISSUERS_0_JWKSURI, value: "http://keycloak.security.svc:8080/realms/difme/protocol/openid-connect/certs" }
            - { name: JAVA_TOOL_OPTIONS, value: "-Xmx512m -XX:MaxMetaspaceSize=256m -XX:ReservedCodeCacheSize=64m -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -Xss512k" }
          ports: [{ name: http, containerPort: 8080 }]
          startupProbe: { httpGet: { path: /fineract-provider/actuator/health, port: 8080 }, periodSeconds: 10, failureThreshold: 60 }   # Liquibase on first start
          readinessProbe: { httpGet: { path: /fineract-provider/actuator/health, port: 8080 }, periodSeconds: 15 }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
          resources: { requests: { cpu: 100m, memory: 880Mi }, limits: { memory: 1Gi } }   # measured 2026-11-21: 866Mi RSS under load (live heap ~250Mi)
      volumes: [{ name: tmp, emptyDir: { sizeLimit: 256Mi } }]
---
apiVersion: v1
kind: Service
metadata: { name: fineract }
spec: { selector: { app: fineract }, ports: [{ name: http, port: 8080 }] }
---
# Creates Fineract's own users for the Keycloak clients that call it, after every sync (idempotent). It logs in through
# Keycloak as client fineract-admin, whose token says fineract_user=mifos (Fineract's admin user).
#   ph-ee-ams: role "Payment hub" (interoperation API, savings and client reads; the permission list is in the script)
#   rails-worker: role "Account opening" (open clients/savings accounts, interop identifiers; no money movement)
apiVersion: batch/v1
kind: Job
metadata: { name: fineract-service-users, annotations: { argocd.argoproj.io/hook: PostSync, argocd.argoproj.io/hook-delete-policy: BeforeHookCreation } }
spec:
  backoffLimit: 30
  template:
    spec:
      restartPolicy: OnFailure
      securityContext: { runAsNonRoot: true, runAsUser: 100, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: users
          image: curlimages/curl:8.11.1
          env:
            - { name: CLIENT_ID, valueFrom: { secretKeyRef: { name: fineract-admin-oauth, key: client-id } } }
            - { name: CLIENT_SECRET, valueFrom: { secretKeyRef: { name: fineract-admin-oauth, key: client-secret } } }
            - { name: TOKEN_URL, value: "http://keycloak.security.svc:8080/realms/difme/protocol/openid-connect/token" }
            - { name: FINERACT, value: "http://fineract:8080/fineract-provider" }
          command: [sh, -c]
          args:
            - |
              set -eu
              until curl -sf "$FINERACT/actuator/health" >/dev/null; do sleep 5; done
              RESP=$(curl -s -w '\n%{http_code}' -X POST "$TOKEN_URL" -d grant_type=client_credentials --data-urlencode "client_id=$CLIENT_ID" \
                --data-urlencode "client_secret=$CLIENT_SECRET" || echo "connection failed")
              TOKEN=$(echo "$RESP" | sed -n 's/.*"access_token":"\([^"]*\)".*/\1/p')
              # On failure say why (HTTP status and Keycloak's error code), never the secret or a token.
              [ -n "$TOKEN" ] || { echo "no token from Keycloak: HTTP $(echo "$RESP" | tail -1), $(echo "$RESP" | grep -o '"error[a-z_]*":"[^"]*"' | tr '\n' ' ')"; exit 1; }
              api() { curl -sf -H "Authorization: Bearer $TOKEN" -H 'Fineract-Platform-TenantId: default' -H 'Content-Type: application/json' "$@"; }
              # id of the first object whose "name" (roles) or "username" (users) is $2, from the JSON list in $1
              id_of() { printf '%s' "$1" | tr '{' '\n' | grep "\"$2\":\"$3\"" | sed -n 's/.*"id":\([0-9]*\).*/\1/p' | head -1; }

              role() {  # name description permission...
                name=$1; desc=$2; shift 2
                id=$(id_of "$(api "$FINERACT/api/v1/roles")" name "$name")
                [ -n "$id" ] || id=$(api -X POST "$FINERACT/api/v1/roles" -d "{\"name\":\"$name\",\"description\":\"$desc\"}" | sed -n 's/.*"resourceId":\([0-9]*\).*/\1/p')
                perms=$(for p in "$@"; do printf '"%s":true,' "$p"; done)
                api -X PUT "$FINERACT/api/v1/roles/$id/permissions" -d "{\"permissions\":{${perms%,}}}" >/dev/null
                echo "$id"
              }
              user() {  # username role-id
                [ -n "$(id_of "$(api "$FINERACT/api/v1/users")" username "$1")" ] && { echo "user $1 exists"; return; }
                # Only ever used through Keycloak: the password is random and thrown away.
                # Fineract's policy: 12-50 chars, upper, lower, digit, symbol, no character twice in a row (tr -s squeezes repeats).
                pw="Dx#$(head -c 16 /dev/urandom | od -An -tx1 | tr -d ' \n' | tr -s '0-9a-f')Q7"
                api -X POST "$FINERACT/api/v1/users" -d "{\"username\":\"$1\",\"firstname\":\"service\",\"lastname\":\"$1\",\"officeId\":1,\
              \"roles\":[$2],\"sendPasswordToEmail\":false,\"password\":\"$pw\",\"repeatPassword\":\"$pw\"}" >/dev/null
                echo "user $1 created"
              }

              hub=$(role "Payment hub" "Mifos payment hub connector (ph-ee-ams)" \
                READ_INTERID CREATE_INTERID DELETE_INTERID READ_INTERQUOTE CREATE_INTERQUOTE READ_INTERREQUEST CREATE_INTERREQUEST \
                READ_INTERTRANSFER CREATE_INTERTRANSFER PREPARE_INTERTRANSFER RELEASE_INTERTRANSFER \
                READ_SAVINGSACCOUNT READ_CLIENT READ_LOAN REPAYMENT_LOAN)
              user ph-ee-ams "$hub"
              issuer=$(role "Card issuer" "DIFME card issuer (card-issuer): debit holds and withdrawals, credit-line disbursements" \
                READ_SAVINGSACCOUNT HOLDAMOUNT_SAVINGSACCOUNT RELEASEAMOUNT_SAVINGSACCOUNT WITHDRAWAL_SAVINGSACCOUNT READ_LOAN DISBURSE_LOAN READ_CLIENT)
              user card-issuer "$issuer"
              # rails-worker (DifmeOpenAccount): opens client + savings account and registers ACCOUNT_ID; creates the two
              # DIFME savings products if missing. No transfers, holds or withdrawals (least privilege, 2026-11-24).
              opener=$(role "Account opening" "DIFME rails-worker: open clients and savings accounts, register interop identifiers" \
                READ_CLIENT CREATE_CLIENT ACTIVATE_CLIENT READ_SAVINGSACCOUNT CREATE_SAVINGSACCOUNT APPROVE_SAVINGSACCOUNT ACTIVATE_SAVINGSACCOUNT \
                READ_SAVINGSPRODUCT CREATE_SAVINGSPRODUCT READ_INTERID CREATE_INTERID READ_OFFICE)
              user rails-worker "$opener"
              lo=$(role "Loan origination" "DIFME loan origination workflows: book, approve and disburse term loans" \
                READ_LOAN CREATE_LOAN APPROVE_LOAN DISBURSE_LOAN READ_CLIENT READ_LOANPRODUCT)
              user loan-origination "$lo"
              # the term-loan product loan origination books against (found by name)
              if [ -z "$(id_of "$(api "$FINERACT/api/v1/loanproducts")" name "DIFME term loan")" ]; then
                api -X POST "$FINERACT/api/v1/loanproducts" -d '{"name":"DIFME term loan","shortName":"DTL","currencyCode":"INR","digitsAfterDecimal":2,
              "inMultiplesOf":0,"principal":100000,"minPrincipal":1000,"maxPrincipal":5000000,"numberOfRepayments":12,"repaymentEvery":1,"repaymentFrequencyType":2,
              "interestRatePerPeriod":1.5,"interestRateFrequencyType":2,"amortizationType":1,"interestType":0,"interestCalculationPeriodType":1,
              "transactionProcessingStrategyCode":"mifos-standard-strategy","accountingRule":1,"daysInYearType":1,"daysInMonthType":1,
              "isInterestRecalculationEnabled":false,"locale":"en"}' >/dev/null && echo "loan product DIFME term loan created"
              fi
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          resources: { requests: { cpu: 10m, memory: 16Mi }, limits: { memory: 64Mi } }
