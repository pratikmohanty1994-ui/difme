# PDF §5.6 — federated SQL across Iceberg, Cassandra (audit), Kafka and YugabyteDB in one query.
# Single node: the coordinator also executes queries (no separate worker JVM; ~1.5 GB saved on the 16 GB Codespace).
# Production overlays raise workers and heap.
server:
  workers: 0
  config: { query: { maxMemory: "512MB" } }   # heap-sized (default 4GB assumes big workers)
# s3.region: SeaweedFS ignores it, but the S3 client SDK refuses to start without one ("Unable to load region", 44731237973).
# Catalog properties read ${ENV:...}; without these the coordinator exits at start ("Environment variable is not set:
# POLARIS_CREDENTIAL", cluster-verify 44717717115). YSQL auth is off in dev, so the password is a placeholder.
env:
  - { name: POLARIS_CREDENTIAL, valueFrom: { secretKeyRef: { name: polaris-client, key: credential } } }
  - { name: YB_TRINO_USER, value: trino }
  - { name: YB_TRINO_PASSWORD, value: dev-ysql-auth-off }
coordinator:
  labels: { istio.io/dataplane-mode: ambient }   # mTLS to yb-tservers (catalog settlements), STRICT meshed tier
  resources: { requests: { cpu: 200m, memory: 768Mi }, limits: { memory: 1280Mi } }   # used 668 Mi at start (run 44724409966)
  jvm: { maxHeapSize: 768M }
  config: { nodeScheduler: { includeCoordinator: true }, query: { maxMemoryPerNode: "256MB" } }   # must fit the 768M heap
catalogs:
  iceberg: |
    connector.name=iceberg
    iceberg.catalog.type=rest
    iceberg.rest-catalog.uri=http://polaris:8181/api/catalog
    iceberg.rest-catalog.warehouse=difme
    iceberg.rest-catalog.security=OAUTH2
    iceberg.rest-catalog.oauth2.credential=${ENV:POLARIS_CREDENTIAL}
    iceberg.rest-catalog.vended-credentials-enabled=true
    fs.native-s3.enabled=true
    s3.endpoint=http://seaweedfs-s3:8333
    s3.path-style-access=true
    s3.region=us-east-1
  events: |
    connector.name=kafka
    kafka.nodes=difme-kafka-bootstrap.streaming.svc:9092
    kafka.table-description-supplier=FILE
    # table descriptions generated from api/asyncapi by ci/asyncapi_to_trino.py (no inline comments in .properties)
    kafka.table-description-dir=/etc/trino/kafka
  settlements: |
    connector.name=postgresql
    connection-url=jdbc:postgresql://yb-tservers.database-tier.svc:5433/difme
    connection-user=${ENV:YB_TRINO_USER}
    connection-password=${ENV:YB_TRINO_PASSWORD}
# Lineage (owner decision 2026-11-20: OpenLineage + Marquez). Trino's built-in listener posts one event per query
# (inputs/outputs, column lineage) to Marquez (lakehouse-extra). When Marquez isn't installed the posts fail and are
# logged; queries are unaffected.
eventListenerProperties:
  - event-listener.name=openlineage
  - openlineage-event-listener.transport.type=HTTP
  - openlineage-event-listener.transport.url=http://marquez.governance.svc:5000
  - openlineage-event-listener.trino.uri=http://trino.lakehouse.svc:8080
  - openlineage-event-listener.namespace=difme
worker: { labels: { istio.io/dataplane-mode: ambient } }
