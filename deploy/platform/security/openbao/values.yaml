# PDF §5.8 — secrets management (OpenBao, ADR-001): dynamic DB creds TTL=1h, PKI CA, transit encryption-as-a-service.
# Dev/verification (owner decision 2026-11-20): one Raft replica (the PDF's vault-0/1/2 HA belongs in production
# overlays; three replicas can't schedule on one node). The static seal auto-unseals from a 32-byte dev key
# (Secret openbao-unseal, made by dev-secrets.sh) after every restart, and self-initialization creates on first start
# what SPIRE needs: the pki_int CA and a Kubernetes-auth role. The root token is revoked after self-init; production
# replaces the static key with OpenBao's KMS/transit seal and gets recovery keys via `bao operator rotate-keys`.
server:
  resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 256Mi } }
  dataStorage: { size: 2Gi }
  extraSecretEnvironmentVars:
    - { envName: BAO_UNSEAL_KEY, secretName: openbao-unseal, secretKey: key }
  ha:
    enabled: true
    replicas: 1
    raft:
      enabled: true
      setNodeId: true
      config: |
        ui = true
        listener "tcp" {
          tls_disable = 1          # in-cluster mTLS comes from the mesh
          address = "[::]:8200"
          cluster_address = "[::]:8201"
        }
        storage "raft" {
          path = "/openbao/data"
        }
        service_registration "kubernetes" {}
        seal "static" {
          current_key_id = "dev-1"
          current_key = "env://BAO_UNSEAL_KEY"
        }
        initialize "spire-ca" {
          request "mount-pki-int" {
            operation = "update"
            path = "sys/mounts/pki_int"
            data = { type = "pki", config = { max_lease_ttl = "87600h" } }
          }
          request "generate-root" {
            operation = "update"
            path = "pki_int/root/generate/internal"
            data = { common_name = "difme.local SPIRE upstream CA", ttl = "87600h" }
          }
        }
        initialize "spire-auth" {
          request "enable-k8s-auth" {
            operation = "update"
            path = "sys/auth/kubernetes"
            data = { type = "kubernetes" }
          }
          request "k8s-auth-config" {
            operation = "update"
            path = "auth/kubernetes/config"
            data = { kubernetes_host = "https://kubernetes.default.svc" }
          }
          request "spire-policy" {
            operation = "update"
            path = "sys/policies/acl/spire-server"
            data = { policy = "path \"pki_int/root/sign-intermediate\" { capabilities = [\"update\"] }" }
          }
          request "spire-role" {
            operation = "update"
            path = "auth/kubernetes/role/spire-server"
            data = {
              bound_service_account_names = ["spire-server"]
              bound_service_account_namespaces = ["security"]
              audience = "vault"
              token_policies = ["spire-server"]
              token_ttl = "1h"
            }
          }
        }
        initialize "evidence-transit" {
          # Evidence custody (decided 2026-11-20): the exchange's operator seal key lives here, non-exportable;
          # exchange-svc may sign and read the public key, nothing else.
          request "mount-transit" {
            operation = "update"
            path = "sys/mounts/transit"
            data = { type = "transit" }
          }
          request "evidence-key" {
            operation = "update"
            path = "transit/keys/evidence-operator"
            data = { type = "ed25519", exportable = false, allow_plaintext_backup = false }
          }
          request "evidence-policy" {
            operation = "update"
            path = "sys/policies/acl/exchange-evidence"
            data = { policy = "path \"transit/sign/evidence-operator\" { capabilities = [\"update\"] }\npath \"transit/keys/evidence-operator\" { capabilities = [\"read\"] }" }
          }
          request "evidence-role" {
            operation = "update"
            path = "auth/kubernetes/role/exchange-evidence"
            data = {
              bound_service_account_names = ["exchange-svc"]
              bound_service_account_namespaces = ["core-platform"]
              audience = "vault"
              token_policies = ["exchange-evidence"]
              token_ttl = "1h"
            }
          }
        }
        initialize "openbao-config" {
          # F2: the openbao-config Job (security/openbao-config) re-applies every request in these blocks on each sync,
          # so clusters whose OpenBao already exists stay in line with this file. Its policy covers exactly the kinds
          # of paths used here (mounts, Kubernetes auth and roles, ACL policies, transit keys); writing ACL policies is
          # admin-equivalent by nature, so only that Job's service account may log in with it, and git is the authority.
          request "config-policy" {
            operation = "update"
            path = "sys/policies/acl/openbao-config"
            data = { policy = "path \"sys/mounts/*\" { capabilities = [\"create\", \"update\", \"read\"] }\npath \"sys/auth/kubernetes\" { capabilities = [\"create\", \"update\", \"read\", \"sudo\"] }\npath \"auth/kubernetes/config\" { capabilities = [\"update\", \"read\"] }\npath \"auth/kubernetes/role/*\" { capabilities = [\"create\", \"update\", \"read\"] }\npath \"sys/policies/acl/*\" { capabilities = [\"create\", \"update\", \"read\"] }\npath \"transit/keys/*\" { capabilities = [\"create\", \"update\", \"read\"] }\npath \"pki_int/cert/ca\" { capabilities = [\"read\"] }\npath \"pki_int/root/generate/internal\" { capabilities = [\"update\"] }" }
          }
          request "config-role" {
            operation = "update"
            path = "auth/kubernetes/role/openbao-config"
            data = {
              bound_service_account_names = ["openbao-config"]
              bound_service_account_namespaces = ["security"]
              audience = "vault"
              token_policies = ["openbao-config"]
              token_ttl = "10m"
            }
          }
        }
        initialize "key-release" {
          # Attested key release (ADR-026): the security module's LMK, KBPK and key list live under kbs/difme/hsm
          # (KV v1, base64 values). Trustee's KBS may only read them; the module may only create missing ones on its
          # first start (never read, update or delete). Nothing else has access.
          request "mount-kbs" {
            operation = "update"
            path = "sys/mounts/kbs"
            data = { type = "kv", options = { version = "1" } }
          }
          request "kbs-read-policy" {
            operation = "update"
            path = "sys/policies/acl/trustee-kbs"
            data = { policy = "path \"kbs/difme/*\" { capabilities = [\"read\"] }" }
          }
          request "kbs-read-role" {
            operation = "update"
            path = "auth/kubernetes/role/trustee-kbs"
            data = {
              bound_service_account_names = ["trustee"]
              bound_service_account_namespaces = ["security"]
              audience = "vault"
              token_policies = ["trustee-kbs"]
              token_ttl = "720h"
            }
          }
          request "hsm-bootstrap-policy" {
            operation = "update"
            path = "sys/policies/acl/hsm-bootstrap"
            data = { policy = "path \"kbs/difme/hsm/*\" { capabilities = [\"create\"] }" }
          }
          request "hsm-bootstrap-role" {
            operation = "update"
            path = "auth/kubernetes/role/hsm-bootstrap"
            data = {
              bound_service_account_names = ["hsm"]
              bound_service_account_namespaces = ["rails"]
              audience = "vault"
              token_policies = ["hsm-bootstrap"]
              token_ttl = "5m"
            }
          }
        }
        initialize "rails-secrets" {
          # Component reuse (owner 2026-11-21): Hyperswitch reads its secrets from here (KV v2) instead of Kubernetes
          # Secrets. Hyperswitch may only read its own path; the seeding Job may only create what is missing.
          request "mount-kv" {
            operation = "update"
            path = "sys/mounts/secret"
            data = { type = "kv", options = { version = "2" } }
          }
          request "hyperswitch-policy" {
            operation = "update"
            path = "sys/policies/acl/hyperswitch"
            data = { policy = "path \"secret/data/rails/hyperswitch\" { capabilities = [\"read\"] }" }
          }
          request "hyperswitch-role" {
            operation = "update"
            path = "auth/kubernetes/role/hyperswitch"
            data = {
              bound_service_account_names = ["hyperswitch"]
              bound_service_account_namespaces = ["rails"]
              audience = "vault"
              token_policies = ["hyperswitch"]
              token_ttl = "10m"
            }
          }
          request "seeder-policy" {
            operation = "update"
            path = "sys/policies/acl/hyperswitch-seeder"
            data = { policy = "path \"secret/data/rails/hyperswitch\" { capabilities = [\"create\"] }\npath \"secret/metadata/rails/hyperswitch\" { capabilities = [\"read\"] }" }
          }
          request "seeder-role" {
            operation = "update"
            path = "auth/kubernetes/role/hyperswitch-seeder"
            data = {
              bound_service_account_names = ["hyperswitch-seeder"]
              bound_service_account_namespaces = ["rails"]
              audience = "vault"
              token_policies = ["hyperswitch-seeder"]
              token_ttl = "5m"
            }
          }
        }
injector: { enabled: true }
csi: { enabled: true }
