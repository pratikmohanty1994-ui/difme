# DIFME attestation-verifier: checks Wasm binary hash against SLSA provenance, nonce freshness, revocation list (§11.1 steps 5a–5c).
apiVersion: apps/v1
kind: Deployment
metadata: { name: attestation-verifier, namespace: security, labels: { app: attestation-verifier } }
spec:
  replicas: 1
  selector: { matchLabels: { app: attestation-verifier } }
  template:
    metadata: { labels: { app: attestation-verifier, difme/team: security, business.metric: fraud-attestation } }
    spec:
      containers:
        - name: verifier
          image: ghcr.io/pratikmohanty1994-ui/difme-attestation-verifier:0.1.0
          # Policy (empty in dev, so every device fails closed to the server-side fraud check): device keys file
          # ("device-id <SEC1 hex>"), approved Wasm module hashes from SLSA provenance, revoked devices.
          env:
            - { name: VERIFIER_APPROVED_WASM, value: "" }
            - { name: VERIFIER_REVOKED, value: "" }
            - { name: VERIFIER_WORKER_THREADS, value: "1" }   # appraisal is microseconds; one runtime worker
          ports: [{ containerPort: 8443 }]
          readinessProbe: { tcpSocket: { port: 8443 }, periodSeconds: 10 }
          # Measured 2026-11-20: 3.7 MiB RSS, 2 threads idle (release build).
          resources: { requests: { cpu: 10m, memory: 16Mi }, limits: { memory: 64Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: attestation-verifier, namespace: security }
spec: { selector: { app: attestation-verifier }, ports: [{ port: 8443 }] }
