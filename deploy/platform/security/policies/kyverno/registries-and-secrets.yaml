# ADR-015: the two former Gatekeeper constraints, as Kyverno rules (one admission engine instead of three).
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata: { name: restrict-registries }
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: difme-workloads-use-difme-images
      match: { any: [{ resources: { kinds: [Pod], namespaces: [core-platform, quinn-hub, back-office-ui] } }] }
      validate:
        message: "Images in DIFME service namespaces must come from the DIFME registry (signed by the image pipeline)."
        pattern:
          spec:
            # DIFME images, plus explicitly approved upstream images (pinned in their manifests). The original
            # Gatekeeper list also allowed docker.io/library; flagd was missing from both (found live).
            containers: [{ image: "ghcr.io/pratikmohanty1994-ui/* | harbor.difme.local/* | docker.io/library/* | ghcr.io/open-feature/flagd:*" }]
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata: { name: no-plaintext-secrets }
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    - name: secret-like-env-must-reference-a-secret
      match: { any: [{ resources: { kinds: [Pod], namespaces: [core-platform, quinn-hub, back-office-ui, ml-platform, streaming, process, forms] } }] }
      validate:
        message: "Credential-like environment variables must use valueFrom (OpenBao / Kubernetes Secret), never a literal value."
        # Refused: a credential-like name with a literal value. Allowed: valueFrom, a $(OTHER_VAR) reference to a
        # Secret-backed variable (the RisingWave chart builds RW_SQL_PASSWORD that way), and variables that only
        # NAME a Secret/key/cert (Strimzi's STRIMZI_*_SECRET_NAME, *_KEY_NAME), which hold no credential.
        foreach:
          - list: "request.object.spec.[initContainers, containers][][].env[] || `[]`"
            deny:
              conditions:
                all:
                  - { key: "{{ regex_match('(?i)(password|secret|token|api_key)', element.name) }}", operator: Equals, value: true }
                  - { key: "{{ regex_match('(?i)_(secret|key|cert|ca)_(name|prefix)$|_secret_prefix$', element.name) }}", operator: Equals, value: false }
                  - { key: "{{ element.value || '' }}", operator: NotEquals, value: "" }
                  - { key: "{{ regex_match('^[$][(]', element.value || '') }}", operator: Equals, value: false }
