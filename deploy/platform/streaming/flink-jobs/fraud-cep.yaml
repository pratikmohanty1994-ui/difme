# PDF §7.4 L3 — Flink CEP fraud patterns (velocity + large amount).
apiVersion: flink.apache.org/v1beta1
kind: FlinkDeployment
metadata: { name: fraud-cep }
spec:
  image: ghcr.io/pratikmohanty1994-ui/difme-flink-jobs:0.1.0
  flinkVersion: v2_2
  flinkConfiguration:
    taskmanager.numberOfTaskSlots: "1"
    execution.checkpointing.interval: "10s"
    execution.checkpointing.mode: EXACTLY_ONCE
    state.backend.type: rocksdb
    execution.checkpointing.dir: s3://flink/checkpoints/fraud-cep
    execution.checkpointing.savepoint-dir: s3://flink/savepoints/fraud-cep   # required by upgradeMode: savepoint
    s3.endpoint: http://seaweedfs-s3.lakehouse.svc:8333
    s3.path.style.access: "true"
    # Lineage to Marquez (lakehouse-extra); when it isn't installed the posts fail and are logged.
    execution.job-status-changed-listeners: io.openlineage.flink.listener.OpenLineageJobStatusChangedListenerFactory
    openlineage.transport.type: http
    openlineage.transport.url: http://marquez.governance.svc:5000
    openlineage.job.namespace: difme
  serviceAccount: flink
  podTemplate:
    spec:
      containers:
        - name: flink-main-container
          env:
            - { name: AWS_ACCESS_KEY_ID, valueFrom: { secretKeyRef: { name: flink-s3, key: access-key } } }
            - { name: AWS_SECRET_ACCESS_KEY, valueFrom: { secretKeyRef: { name: flink-s3, key: secret-key } } }
            - { name: AWS_REGION, value: local }
  jobManager: { resource: { memory: 768m, cpu: 0.2 } }
  taskManager: { resource: { memory: 1024m, cpu: 0.3 } }
  job: { jarURI: local:///opt/flink/usrlib/difme-flink-jobs.jar, entryClass: dev.difme.flink.fraud.FraudCepJob, parallelism: 1, upgradeMode: savepoint }
