# Connects the exchange (core-platform) to the real rails: with this ConfigMap present, exchange-svc charges partner
# cards and books escrow through the payment hub instead of its simulators (read at pod start: restart exchange-svc
# after the rails profile is first installed). Partner cards are the scheme simulator's seeded test cards
# (deploy/platform/rails/scheme-sim): partner node : PAN : expiry MMYY.
apiVersion: v1
kind: ConfigMap
metadata: { name: exchange-rails }
data:
  DIFME_EXCHANGE_HUB_URL: "http://payment-hub.rails.svc:8090"
  # "*": the card for partners without their own (standing mandates' partner nodes are assigned at registration).
  # D3: escrow movements through Mifos PH-EE (on-us transfers; status from Fluxnova history). Card payments too: the
  # DifmeCardCheckout / DifmeCardRefund flows, answered by the rails-worker (rails), then an on-us transfer
  # card-settlement -> merchant-<m>. Secrets (client secret, Fluxnova login) come from Secret exchange-phee. Remove
  # these four to go back to the hub (CARD_FLOWS "false" keeps escrow on PH-EE and cards on the hub).
  DIFME_EXCHANGE_PHEE_CHANNEL_URL: "http://ph-ee-connector-channel.rails.svc:8080"
  DIFME_EXCHANGE_PHEE_TOKEN_URL: "http://keycloak.security.svc:8080/realms/difme/protocol/openid-connect/token"
  DIFME_EXCHANGE_PHEE_FLUXNOVA_URL: "http://fluxnova.process.svc:8080/engine-rest"
  DIFME_EXCHANGE_PHEE_CARD_FLOWS: "true"
  # Accounts (escrow, partner-*, merchant-*, card-settlement) opened through PH-EE's DifmeOpenAccount before first use.
  DIFME_EXCHANGE_PHEE_OPEN_ACCOUNTS: "true"
  DIFME_EXCHANGE_HUB_PARTNER_CARDS: "1:4375510000000001:1230,2:4375510000000019:1230,3:4375510000000027:1230,*:4375510000000001:1230"
