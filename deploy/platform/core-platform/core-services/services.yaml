# Ports from PDF §5.3: cmd 8080 · qry 8081 · saga 8082 · consistency-router 8083 · rate-limiter 8084 · rehydration 8085.
# Input for deploy/components/quarkus-service/render.py (not a kustomize resource).
#   group: core      → core profile (needs databases, Temporal, Valkey)
#   group: streaming → streaming profile (needs Kafka)
apiVersion: v1
kind: ConfigMap
metadata: { name: difme-services }
data:
  services.yaml: |
    - { name: quarkus-cmd-svc,     port: 8080, image: difme-cmd-svc,            team: payments,   metric: payment-processing, cpu: 100m, mem: 448Mi, rollout: true }   # Argo Rollout (canary-gates) owns replicas
    - { name: quarkus-qry-svc,     port: 8081, image: difme-qry-svc,            team: payments,   metric: account-query,      cpu: 50m,  mem: 256Mi }
    - { name: saga-orchestrator,   port: 8082, image: difme-saga-orchestrator,  team: payments,   metric: settlement-saga,    cpu: 50m,  mem: 320Mi, loans: true }   # loan origination workflows (ADR-025)
    - { name: consistency-router,  port: 8083, image: difme-consistency-router, team: platform,   metric: payment-processing, cpu: 10m,  mem: 48Mi }
    - { name: rate-limiter,        port: 8084, image: difme-rate-limiter,       team: platform,   metric: rate-limiting,      cpu: 20m,  mem: 64Mi }
    - { name: rehydration-svc,     port: 8085, image: difme-rehydration-svc,    team: edge,       metric: offline-rehydration, cpu: 50m, mem: 224Mi, group: streaming, autoscaled: true }   # KEDA (keda-scalers)
    - { name: projection-svc,      port: 8086, image: difme-projection-svc,     team: payments,   metric: payment-processing, cpu: 20m,  mem: 96Mi,  group: streaming, autoscaled: true }    # KEDA (keda-scalers)
    - { name: exchange-svc,        port: 8089, image: difme-exchange-svc,       team: exchange,   metric: exchange-matching,  cpu: 50m,  mem: 256Mi, evidence: true, store: true, rails: true }   # ADR-020 (DiscountAI and later verticals)
    - { name: replay-engine,       port: 8087, image: difme-replay-engine,      team: compliance, metric: audit-replay,       cpu: 20m,  mem: 96Mi,  group: streaming }
