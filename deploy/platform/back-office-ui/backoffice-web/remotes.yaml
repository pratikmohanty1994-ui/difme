# One Deployment + Service per remote; rendered from this list by kustomize replacements would add little — kept explicit.
apiVersion: apps/v1
kind: Deployment
metadata: { name: remote-settlements, labels: { app: remote-settlements } }
spec:
  replicas: 1
  selector: { matchLabels: { app: remote-settlements } }
  template:
    metadata: { labels: { app: remote-settlements, difme/team: settlements, business.metric: backoffice-ui } }
    spec: { containers: [{ name: web, image: ghcr.io/pratikmohanty1994-ui/difme-remote-settlements:0.1.0, ports: [{ containerPort: 8080 }], resources: { requests: { cpu: 10m, memory: 32Mi }, limits: { memory: 64Mi } } }] }
---
apiVersion: v1
kind: Service
metadata: { name: remote-settlements }
spec: { selector: { app: remote-settlements }, ports: [{ port: 80, targetPort: 8080 }] }
---
