# Shared platform Postgres (ADR-008, ADR-019): PostgreSQL 17 + DocumentDB extension (MIT). Hosts FerretDB (formio),
# Fluxnova, Keycloak, Temporal (default + visibility stores), RisingWave meta and Harbor. Payments stay on YugabyteDB.
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: postgres-docdb, labels: { app: postgres-docdb } }
spec:
  serviceName: postgres-docdb
  replicas: 1
  selector: { matchLabels: { app: postgres-docdb } }
  template:
    metadata: { labels: { app: postgres-docdb } }
    spec:
      containers:
        - name: postgres
          image: ghcr.io/ferretdb/postgres-documentdb:17-0.107.0-ferretdb-2.7.0
          env:
            - { name: POSTGRES_USER, value: difme }
            - { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: postgres-docdb, key: password } } }
            - { name: POSTGRES_DB, value: postgres }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
            - { name: TEMPORAL_DB_PASSWORD, valueFrom: { secretKeyRef: { name: temporal-db, key: password } } }
            - { name: RISINGWAVE_DB_PASSWORD, valueFrom: { secretKeyRef: { name: risingwave-db, key: password } } }
            - { name: HARBOR_DB_PASSWORD, valueFrom: { secretKeyRef: { name: harbor-db, key: password } } }
            - { name: MARQUEZ_DB_PASSWORD, valueFrom: { secretKeyRef: { name: marquez-db, key: password } } }
            - { name: ML_DB_PASSWORD, valueFrom: { secretKeyRef: { name: ml-db, key: password } } }
            - { name: MLFLOW_DB_PASSWORD, valueFrom: { secretKeyRef: { name: mlflow-db, key: password } } }
            - { name: POLARIS_DB_PASSWORD, valueFrom: { secretKeyRef: { name: polaris-db, key: password } } }
            - { name: FINERACT_DB_PASSWORD, valueFrom: { secretKeyRef: { name: fineract-db, key: password, optional: true } } }
            - { name: HYPERSWITCH_DB_PASSWORD, valueFrom: { secretKeyRef: { name: hyperswitch-db, key: password, optional: true } } }
            - { name: TAZAMA_DB_PASSWORD, valueFrom: { secretKeyRef: { name: tazama-db, key: password, optional: true } } }
            - { name: CARD_ISSUER_DB_PASSWORD, valueFrom: { secretKeyRef: { name: card-issuer-db, key: password, optional: true } } }
            - { name: APICURIO_DB_PASSWORD, valueFrom: { secretKeyRef: { name: apicurio-db, key: password } } }
          ports: [{ containerPort: 5432 }]
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            # One file per script (subPath), not the whole directory: mounting the ConfigMap over
            # /docker-entrypoint-initdb.d hid the image's own init, which creates the DocumentDB extension FerretDB needs
            # (formio: 'schema "documentdb_api" does not exist'; creating it by hand failed and stopped the init chain).
            - { name: init, mountPath: /docker-entrypoint-initdb.d/05-settings.sql, subPath: 05-settings.sql }
            - { name: init, mountPath: /docker-entrypoint-initdb.d/10-fluxnova.sql, subPath: 10-fluxnova.sql }
            - { name: init, mountPath: /docker-entrypoint-initdb.d/20-temporal.sh, subPath: 20-temporal.sh }
            - { name: init, mountPath: /docker-entrypoint-initdb.d/30-risingwave.sh, subPath: 30-risingwave.sh }
            - { name: init, mountPath: /docker-entrypoint-initdb.d/40-harbor.sh, subPath: 40-harbor.sh }
            - { name: init, mountPath: /docker-entrypoint-initdb.d/50-marquez.sh, subPath: 50-marquez.sh }
            - { name: init, mountPath: /docker-entrypoint-initdb.d/60-ml-vectors.sh, subPath: 60-ml-vectors.sh }
            - { name: init, mountPath: /docker-entrypoint-initdb.d/70-polaris.sh, subPath: 70-polaris.sh }
            - { name: init, mountPath: /docker-entrypoint-initdb.d/90-fineract.sh, subPath: 90-fineract.sh }
            - { name: init, mountPath: /docker-entrypoint-initdb.d/95-hyperswitch.sh, subPath: 95-hyperswitch.sh }
            - { name: init, mountPath: /docker-entrypoint-initdb.d/96-tazama.sh, subPath: 96-tazama.sh }
            - { name: init, mountPath: /docker-entrypoint-initdb.d/97-card-issuer.sh, subPath: 97-card-issuer.sh }
            - { name: init, mountPath: /docker-entrypoint-initdb.d/80-apicurio.sh, subPath: 80-apicurio.sh }
          resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { memory: 768Mi } }
          readinessProbe: { exec: { command: [pg_isready, -U, difme] }, periodSeconds: 5 }
      volumes: [{ name: init, configMap: { name: postgres-docdb-init } }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 4Gi } } }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: postgres-docdb-init }
data:
  # Ten tools share this server (Temporal alone opens several pools). The default 100 connections ran out with all
  # profiles up, and new connections were dropped at the SSL handshake (Polaris bootstrap, all-at-once run 3). Set via
  # ALTER SYSTEM, not container args, so the image's own start command (DocumentDB preload settings) stays untouched;
  # the entrypoint restarts the server after the init scripts, which applies it. ~2 MB of shared memory per 100.
  05-settings.sql: |
    ALTER SYSTEM SET max_connections = 300;
  10-fluxnova.sql: |
    CREATE DATABASE fluxnova;
    CREATE DATABASE keycloak;
  # First boot only (docker-entrypoint-initdb.d). Temporal gets its own role without CREATEDB; it owns its two databases.
  20-temporal.sh: |
    #!/bin/bash
    set -euo pipefail
    psql -v ON_ERROR_STOP=1 -v pw="$TEMPORAL_DB_PASSWORD" --username "$POSTGRES_USER" --dbname postgres <<'SQL'
    CREATE ROLE temporal LOGIN PASSWORD :'pw';
    CREATE DATABASE temporal OWNER temporal;
    CREATE DATABASE temporal_visibility OWNER temporal;
    SQL
  # RisingWave's meta store (ADR-019 pattern): its sea-orm migrations are not reliable on YugabyteDB
  # (slow DDL, then a re-applied init migration and a crash), so it lives here like Temporal.
  30-risingwave.sh: |
    #!/bin/bash
    set -euo pipefail
    psql -v ON_ERROR_STOP=1 -v pw="$RISINGWAVE_DB_PASSWORD" --username "$POSTGRES_USER" --dbname postgres <<'SQL'
    CREATE ROLE risingwave LOGIN PASSWORD :'pw';
    CREATE DATABASE risingwave OWNER risingwave;
    SQL
  # Harbor (platform-ops) supports PostgreSQL only; its first schema migration failed on YugabyteDB and left the
  # migration "dirty" (cluster-verify 2026-11-20; owner decision: shared Postgres).
  40-harbor.sh: |
    #!/bin/bash
    set -euo pipefail
    psql -v ON_ERROR_STOP=1 -v pw="$HARBOR_DB_PASSWORD" --username "$POSTGRES_USER" --dbname postgres <<'SQL'
    CREATE ROLE harbor LOGIN PASSWORD :'pw';
    CREATE DATABASE harbor OWNER harbor;
    SQL
  # Marquez (lineage, instead of DataHub; owner decision 2026-11-20). Its Flyway migrations run on startup.
  50-marquez.sh: |
    #!/bin/bash
    set -euo pipefail
    psql -v ON_ERROR_STOP=1 -v pw="$MARQUEZ_DB_PASSWORD" --username "$POSTGRES_USER" --dbname postgres <<'SQL'
    CREATE ROLE marquez LOGIN PASSWORD :'pw';
    CREATE DATABASE marquez OWNER marquez;
    SQL
  # Vector search (owner decision 2026-11-20: pgvector instead of Weaviate). The image ships pgvector (DocumentDB
  # depends on it). The extension step can't stop the init chain: a failure there would leave core without Temporal.
  60-ml-vectors.sh: |
    #!/bin/bash
    set -euo pipefail
    psql -v ON_ERROR_STOP=1 -v pw="$ML_DB_PASSWORD" --username "$POSTGRES_USER" --dbname postgres <<'SQL'
    CREATE ROLE ml LOGIN PASSWORD :'pw';
    CREATE DATABASE ml OWNER ml;
    SQL
    # MLflow's backend store (moved off YugabyteDB, see deploy/platform/ml-platform/mlflow/values.yaml).
    psql -v ON_ERROR_STOP=1 -v pw="$MLFLOW_DB_PASSWORD" --username "$POSTGRES_USER" --dbname postgres <<'SQL'
    CREATE ROLE mlflow LOGIN PASSWORD :'pw';
    CREATE DATABASE mlflow OWNER mlflow;
    SQL
    psql --username "$POSTGRES_USER" --dbname ml -c 'CREATE EXTENSION IF NOT EXISTS vector' \
      || echo "WARNING: pgvector extension not created in database ml" >&2
  # Polaris (Iceberg REST catalog) metadata, moved off YugabyteDB; the polaris-bootstrap Job creates its schema.
  70-polaris.sh: |
    #!/bin/bash
    set -euo pipefail
    psql -v ON_ERROR_STOP=1 -v pw="$POLARIS_DB_PASSWORD" --username "$POSTGRES_USER" --dbname postgres <<'SQL'
    CREATE ROLE polaris LOGIN PASSWORD :'pw';
    CREATE DATABASE polaris OWNER polaris;
    SQL
  # Fineract (CBS simulator, rails profile): its tenant store and the default tenant (owner 2026-11-21).
  90-fineract.sh: |
    #!/bin/bash
    set -euo pipefail
    [ -n "${FINERACT_DB_PASSWORD:-}" ] || { echo "no fineract-db secret: skipping"; exit 0; }
    psql -v ON_ERROR_STOP=1 -v pw="$FINERACT_DB_PASSWORD" --username "$POSTGRES_USER" --dbname postgres <<'SQL'
    CREATE ROLE fineract LOGIN PASSWORD :'pw';
    CREATE DATABASE fineract_tenants OWNER fineract;
    CREATE DATABASE fineract_default OWNER fineract;
    SQL
  # Hyperswitch (PSP simulator, rails profile): its own database; the router's init container applies the schema.
  95-hyperswitch.sh: |
    #!/bin/bash
    set -euo pipefail
    [ -n "${HYPERSWITCH_DB_PASSWORD:-}" ] || { echo "no hyperswitch-db secret: skipping"; exit 0; }
    psql -v ON_ERROR_STOP=1 -v pw="$HYPERSWITCH_DB_PASSWORD" --username "$POSTGRES_USER" --dbname postgres <<'SQL'
    CREATE ROLE hyperswitch LOGIN PASSWORD :'pw';
    CREATE DATABASE hyperswitch OWNER hyperswitch;
    SQL
  # Tazama (fraud profile, ADR-023): one role, its five stores prefixed tazama_ (the upstream names, e.g. "configuration",
  # are too generic for a shared server); the schema job in the fraud namespace applies the tables.
  96-tazama.sh: |
    #!/bin/bash
    set -euo pipefail
    [ -n "${TAZAMA_DB_PASSWORD:-}" ] || { echo "no tazama-db secret: skipping"; exit 0; }
    psql -v ON_ERROR_STOP=1 -v pw="$TAZAMA_DB_PASSWORD" --username "$POSTGRES_USER" --dbname postgres <<'SQL'
    CREATE ROLE tazama LOGIN PASSWORD :'pw';
    CREATE DATABASE tazama_configuration OWNER tazama;
    CREATE DATABASE tazama_event_history OWNER tazama;
    CREATE DATABASE tazama_raw_history OWNER tazama;
    CREATE DATABASE tazama_evaluation OWNER tazama;
    CREATE DATABASE tazama_enrichment OWNER tazama;
    SQL
  # Card issuer (ADR-024): cards (PAN only sealed by the card vault) and authorisations.
  97-card-issuer.sh: |
    #!/bin/bash
    set -euo pipefail
    [ -n "${CARD_ISSUER_DB_PASSWORD:-}" ] || { echo "no card-issuer-db secret: skipping"; exit 0; }
    psql -v ON_ERROR_STOP=1 -v pw="$CARD_ISSUER_DB_PASSWORD" --username "$POSTGRES_USER" --dbname postgres <<'SQL'
    CREATE ROLE card_issuer LOGIN PASSWORD :'pw';
    CREATE DATABASE card_issuer OWNER card_issuer;
    SQL
  # Apicurio Registry storage, moved off YugabyteDB (duplicate version rows under load).
  80-apicurio.sh: |
    #!/bin/bash
    set -euo pipefail
    psql -v ON_ERROR_STOP=1 -v pw="$APICURIO_DB_PASSWORD" --username "$POSTGRES_USER" --dbname postgres <<'SQL'
    CREATE ROLE apicurio LOGIN PASSWORD :'pw';
    CREATE DATABASE apicurio OWNER apicurio;
    SQL
---
apiVersion: v1
kind: Service
metadata: { name: postgres-docdb }
spec: { selector: { app: postgres-docdb }, ports: [{ port: 5432 }] }
