quarkus.application.name=hyperswitch-worker
quarkus.http.port=8091
# Fluxnova's engine REST API (external tasks of PH-EE's DifmeCardCheckout / DifmeCardRefund); user:password = Basic auth.
difme.hsworker.fluxnova.url=${FLUXNOVA_ENGINE_URL:http://fluxnova.process.svc:8080/engine-rest}
difme.hsworker.fluxnova.basic=${FLUXNOVA_BASIC:}
# PSP (Hyperswitch): the admin key sets up DIFME's merchant and card connector; the acquirer key is the connector's key.
difme.hsworker.hyperswitch.url=${HYPERSWITCH_URL:http://hyperswitch.rails.svc:8080}
difme.hsworker.hyperswitch.admin-key=${HYPERSWITCH_ADMIN_KEY:}
difme.hsworker.hyperswitch.acquirer-key=${HYPERSWITCH_ACQUIRER_KEY:}
# Cards on file, "ref:PAN:MMYY" comma-separated; ref "*" = the card for references without their own (test cards).
difme.hsworker.cards=${HSWORKER_CARDS:}
difme.hsworker.enabled=${HSWORKER_ENABLED:true}
quarkus.micrometer.export.prometheus.path=/q/metrics
