quarkus.application.name=rails-worker
quarkus.http.port=8091
# Fluxnova's engine REST API (external tasks of PH-EE's DifmeCardCheckout / DifmeCardRefund); user:password = Basic auth.
difme.railsworker.fluxnova.url=${FLUXNOVA_ENGINE_URL:http://fluxnova.process.svc:8080/engine-rest}
difme.railsworker.fluxnova.basic=${FLUXNOVA_BASIC:}
# PSP (Hyperswitch): the admin key sets up DIFME's merchant and card connector; the acquirer key is the connector's key.
difme.railsworker.hyperswitch.url=${HYPERSWITCH_URL:http://hyperswitch.rails.svc:8080}
difme.railsworker.hyperswitch.admin-key=${HYPERSWITCH_ADMIN_KEY:}
difme.railsworker.hyperswitch.acquirer-key=${HYPERSWITCH_ACQUIRER_KEY:}
# Cards on file, "ref:PAN:MMYY" comma-separated; ref "*" = the card for references without their own (test cards).
difme.railsworker.cards=${RAILSWORKER_CARDS:}
difme.railsworker.enabled=${RAILSWORKER_ENABLED:true}
quarkus.micrometer.export.prometheus.path=/q/metrics
# Fineract (DifmeOpenAccount: accounts opened on first use with their ACCOUNT_ID); off when FINERACT_URL is unset.
difme.railsworker.fineract.url=${FINERACT_URL:}
difme.railsworker.fineract.token-url=${FINERACT_TOKEN_URL:}
difme.railsworker.fineract.client-id=${FINERACT_CLIENT_ID:}
difme.railsworker.fineract.client-secret=${FINERACT_CLIENT_SECRET:}
