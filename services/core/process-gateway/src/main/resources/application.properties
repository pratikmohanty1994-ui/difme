quarkus.application.name=process-gateway
quarkus.http.port=8088

quarkus.rest-client.fluxnova.url=${FLUXNOVA_URL:http://fluxnova.process.svc:8080/engine-rest}
quarkus.rest-client.formio.url=${FORMIO_URL:http://formio.forms.svc:3001}
difme.fluxnova.user=${FLUXNOVA_USER:difme-gateway}
difme.fluxnova.password=${FLUXNOVA_PASSWORD:}
difme.formio.api-key=${FORMIO_API_KEY:}

# BPMN service tasks with these topics start the named Temporal workflow (ADR-008).
difme.bridge.enabled=${BRIDGE_ENABLED:true}
difme.bridge.worker-id=${HOSTNAME:process-gateway}
difme.bridge.topics=temporal:AccountProvisioningWorkflow,temporal:LoanScreeningWorkflow,temporal:LoanBookingWorkflow
difme.bridge.task-queue."AccountProvisioningWorkflow"=accounts-saga
difme.bridge.task-queue."LoanScreeningWorkflow"=loans-saga
difme.bridge.task-queue."LoanBookingWorkflow"=loans-saga
difme.bridge.lock-duration-ms=30000
difme.bridge.long-poll-ms=20000

difme.temporal.target=${TEMPORAL_TARGET:temporal-frontend.temporal.svc:7233}
difme.temporal.namespace=default
difme.rules.cache.max-size=50000
difme.rules.cache.ttl=PT10M

quarkus.otel.exporter.otlp.endpoint=${QUARKUS_OTEL_EXPORTER_OTLP_ENDPOINT:http://alloy.observability.svc:4317}
