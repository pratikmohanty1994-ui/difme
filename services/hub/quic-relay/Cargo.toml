[package]
name = "difme-quic-relay"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Scenario D local QUIC relay: edge devices → relay → quinn-hub. Terminates the device's QUIC connection on a nearby site and splices its streams onto one upstream QUIC connection per device."

[dependencies]
difme-quinn-hub = { path = ".." }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
axum = "0.8"

[dev-dependencies]
tonic = "0.14"
prost = "0.14"
tokio-stream = { version = "0.1", features = ["net"] }
