[package]
name = "difme-notary"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
description = "Independent evidence witness: counter-signs sealed evidence-chain hashes with its own Ed25519 key and keeps an append-only record of what it witnessed."

[lib]
path = "src/lib.rs"

[dependencies]
tokio = { version = "1.54", features = ["rt", "macros", "net", "signal", "fs", "io-util", "sync"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = "2"
base64 = "0.22"
hex = "0.4"
# Attested key release (keys only in the emulated TEE): KBS client, JWE (RSA-OAEP-256 + A256GCM), plain HTTP inside the mesh
ureq = { version = "3", default-features = false }
rsa = { version = "0.9", features = ["sha2"] }
sha2 = "0.10"
aes-gcm = "0.10"
rand = "0.8"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
